  };
  const compactRows = (kind, rows, anchor)=>{
    if(!rows.length) return;
    const slot = analysisCornerContentRect(kind, 12);
    const rightAligned = anchor.includes('right');
    ctx.save();
    ctx.beginPath();
    ctx.rect(slot.left, slot.top, slot.width, slot.height);
    ctx.clip();
    ctx.fillStyle = `rgba(255,255,255,${0.95 * boxAlpha})`;
    ctx.shadowColor = `rgba(0,0,0,${0.96 * boxAlpha})`;
    ctx.shadowBlur = 2 * devicePixelRatio;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    ctx.textAlign = rightAligned ? 'right' : 'left';
    ctx.textBaseline = 'top';
    const x = rightAligned ? slot.right : slot.left;
    const contentH = textSize * rows.length + lineGap * Math.max(0, rows.length - 1);
    const y = anchor.includes('bottom') ? Math.max(slot.top, slot.bottom - contentH) : slot.top;
    rows.forEach((row, idx)=>{
      const rowY = y + idx * rowH;
      if(row.kind === 'notation'){
        const innerWidth = Math.max(1, slot.width);
        if(!rightAligned && measureCustomNotation(ctx, row.notation, textSize, smallTextSize, false) <= innerWidth){
          drawCustomNotation(ctx, row.notation, x, rowY, textSize, smallTextSize, false);
        }else{
          ctx.font = `${textSize}px system-ui`;
          ctx.fillText(fitCanvasLine(customNotationPlainText(row.notation, false), innerWidth), x, rowY);
        }
      }else{
        ctx.font = `${textSize}px system-ui`;
        ctx.fillText(fitCanvasLine(row.text, Math.max(1, slot.width)), x, rowY);
      }
    });
    ctx.restore();
  };

  compactRows('chord', [
    {kind:'text', text:formatChordNameForDisplay(chordSummary.formalCode)},
    ...(chordSummary.customNotation ? [{kind:'notation', notation:chordSummary.customNotation}] : [])
  ], 'top-left');
  compactRows('degree', [
    {kind:'text', text:formatChordNameForDisplay(chordSummary.formalDegreeCode || '–')}
  ], 'top-right');

  if(!showCandidates) return;
  const slot = analysisCornerContentRect('candidates', 12);
  const pad = Math.min(10 * devicePixelRatio, slot.width * 0.07, slot.height * 0.08);
  const candidateTextSize = Math.min(textSize, 14 * devicePixelRatio);
  const candidateRowH = candidateTextSize + lineGap;
  const sourceLines = Array.isArray(chordSummary.candidates) && chordSummary.candidates.length
    ? chordSummary.candidates.map((candidate)=>
        `${formatChordNameForDisplay(candidate.name)} | ${formatChordNameForDisplay(candidate.degreeName || '–')}`
      )
    : ['–'];

  // The lower-left corner is a quick glance area, not a replacement for the
  // configured candidate list. Keep it to one compact column: up to four
  // entries, or three entries plus a single `… +N` summary. The full candidate
  // count remains available to the side layout and analysis model.
  const visibleLines = sourceLines.length <= 4
    ? sourceLines.slice()
    : [...sourceLines.slice(0, 3), `… +${sourceLines.length - 3}`];

  ctx.save();
  ctx.beginPath();
  ctx.rect(slot.left, slot.top, slot.width, slot.height);
  ctx.clip();
  ctx.font = `${candidateTextSize}px system-ui`;
  const innerMaxW = Math.max(1, slot.width - pad * 2);
  const fittedLines = visibleLines.map((line)=>fitCanvasLine(line, innerMaxW));
  const bodyWidth = Math.max(...fittedLines.map((line)=>ctx.measureText(line).width), 0);
  const boxW = Math.min(slot.width, bodyWidth + pad * 2);
  const boxH = Math.min(
    slot.height,
    pad * 2 + candidateTextSize * fittedLines.length + lineGap * Math.max(0, fittedLines.length - 1)
  );
  const x = slot.left;
  const y = slot.bottom - boxH;
  frame(x, y, boxW, boxH);
  ctx.fillStyle = `rgba(255,255,255,${0.95 * boxAlpha})`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, boxW, boxH);
  ctx.clip();
  ctx.font = `${candidateTextSize}px system-ui`;
  const startY = y + pad;
  fittedLines.forEach((line, rowIdx)=>ctx.fillText(line, x + pad, startY + rowIdx * candidateRowH));
  ctx.restore();
  ctx.restore();
}

function drawChordOverlay(chordSummary, showCandidates = false){
  if(!chordSummary) return;
  const content = analysisOverlayContentRect('chord', 12);
  if(content.placement !== 'side-keyboard-above'){
    drawChordCornerOverlay(chordSummary, showCandidates);
    return;
  }
  const pad = Math.min(12 * devicePixelRatio, content.width * 0.08, content.height * 0.08);
  const lineGap = 5 * devicePixelRatio;
  const textSize = Math.max(11 * devicePixelRatio, labelFontPx * devicePixelRatio * 0.9);
  const smallTextSize = textSize * 0.72;
  const headerRows = [
    {kind:'text', text:`Chord: ${formatChordNameForDisplay(chordSummary.formalCode)}`},
    {kind:'text', text:`Degree: ${formatChordNameForDisplay(chordSummary.formalDegreeCode || '–')}`},
    ...(chordSummary.customNotation ? [{kind:'notation', notation:chordSummary.customNotation}] : [])
  ];
  if(showCandidates) headerRows.push({kind:'text', text:`${t('candidates')}:`});
  const candidateLines = showCandidates && chordSummary.candidates.length
    ? chordSummary.candidates.map((c)=>`${formatChordNameForDisplay(c.name)} | ${formatChordNameForDisplay(c.degreeName || '–')}`)
    : showCandidates ? ['–'] : [];

  ctx.save();
  ctx.beginPath();
  ctx.rect(content.left, content.top, content.width, content.height);
  ctx.clip();
  ctx.font = `${textSize}px system-ui`;

  const rowH = textSize + lineGap;
  const headerHeight = rowH * headerRows.length;
  const innerMaxW = Math.max(1, content.width - pad * 2);
  const availableForCandidates = Math.max(0, content.height - (pad * 2 + headerHeight));
  const rowsPerColumn = Math.max(0, Math.floor(availableForCandidates / rowH));
  const gapX = 18 * devicePixelRatio;
  const minColumnWidth = 108 * devicePixelRatio;
  const maxColumnsFit = Math.max(1, Math.floor((innerMaxW + gapX) / (minColumnWidth + gapX)));
  const requestedColumns = rowsPerColumn > 0 ? Math.ceil(candidateLines.length / rowsPerColumn) : 0;
  const columnCount = Math.min(maxColumnsFit, requestedColumns);
  const capacity = rowsPerColumn * columnCount;
  const visibleCandidateLines = capacity > 0 ? candidateLines.slice(0, capacity) : [];
  if(candidateLines.length > visibleCandidateLines.length && visibleCandidateLines.length){
    const shownBeforeSummary = visibleCandidateLines.length - 1;
    visibleCandidateLines[visibleCandidateLines.length - 1] = `… +${candidateLines.length - shownBeforeSummary}`;
  }
  const actualColumnCount = rowsPerColumn > 0 ? Math.ceil(visibleCandidateLines.length / rowsPerColumn) : 0;
  const columnWidthLimit = actualColumnCount > 0
    ? Math.max(1, (innerMaxW - gapX * Math.max(0, actualColumnCount - 1)) / actualColumnCount)
    : innerMaxW;
  const columns = [];
  for(let i=0;i<visibleCandidateLines.length;i+=rowsPerColumn){
    columns.push(visibleCandidateLines.slice(i, i + rowsPerColumn).map((line)=>fitCanvasLine(line, columnWidthLimit)));
  }
  const colWidths = columns.map((col)=>Math.min(columnWidthLimit, Math.max(...col.map((line)=>ctx.measureText(line).width), 0)));
  const bodyWidth = colWidths.reduce((a,b)=>a+b,0) + Math.max(0, (columns.length-1)*gapX);
  const headerWidth = Math.max(...headerRows.map((row)=>{
    if(row.kind === 'notation') return measureCustomNotation(ctx, row.notation, textSize, smallTextSize);
    ctx.font = `${textSize}px system-ui`;
    return ctx.measureText(row.text).width;
  }));
  ctx.font = `${textSize}px system-ui`;
  const boxW = Math.min(content.width, Math.max(headerWidth, bodyWidth) + pad * 2);
  const candidateRowsMax = Math.max(...columns.map((c)=>c.length), 0);
  const boxH = Math.min(content.height, pad * 2 + headerHeight + candidateRowsMax * rowH);

  const landscape = cv.width > cv.height * 1.25;
  let preferredX = content.left;
  let preferredY = content.bottom - boxH;
  if(!landscape){
    const {cx, cy} = canvasCenter();
    const {rMax} = ringParams();
    preferredX = cx - rMax;
    preferredY = cy + rMax + 18 * devicePixelRatio;
  }
  const x = Math.max(content.left, Math.min(content.right - boxW, preferredX));
  const y = Math.max(content.top, Math.min(content.bottom - boxH, preferredY));
  const boxAlpha = Math.max(0, Math.min(1, compositionInfoAlpha));
  ctx.fillStyle = `rgba(10,14,20,${0.76 * boxAlpha})`;
  ctx.fillRect(x, y, boxW, boxH);
  ctx.strokeStyle = `rgba(255,255,255,${0.2 * boxAlpha})`;
  ctx.lineWidth = Math.max(1, 1.2 * devicePixelRatio);
  ctx.strokeRect(x, y, boxW, boxH);
  ctx.fillStyle = `rgba(255,255,255,${0.95 * boxAlpha})`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, boxW, boxH);
  ctx.clip();

  headerRows.forEach((row, idx)=>{
    const rowY = y + pad + idx * rowH;
    if(row.kind === 'notation'){
      drawCustomNotation(ctx, row.notation, x + pad, rowY, textSize, smallTextSize);
    }else{
      ctx.font = `${textSize}px system-ui`;
      ctx.fillText(fitCanvasLine(row.text, Math.max(1, boxW - pad * 2)), x + pad, rowY);
    }
  });

  ctx.font = `${textSize}px system-ui`;
  let colX = x + pad;
  const startY = y + pad + headerHeight;
  columns.forEach((col, colIdx)=>{
    col.forEach((line, rowIdx)=>{
      ctx.fillText(line, colX, startY + rowIdx * rowH);
    });
    colX += colWidths[colIdx] + gapX;
  });

  ctx.restore();
  ctx.restore();
}

/* ===== Main draw loop ===== */
let prevT=null;
let lastCompositionSummary = null;
let lastChordSummary = null;
// draw はキャンバス全体のメイン描画ループ。
// 物理演算の結果を反映しながら、水面・ノート・補助情報を毎フレーム再描画する。
function draw(){
  const w=cv.width, h=cv.height;
  const {cx, cy} = canvasCenter();
  const {rMax, step, octaves, minRadius, minFreq: displayMinFreq, maxFreq: displayMaxFreq} = ringParams();
  const now = performance.now()/1000;
  // 前フレームとの経過時間を計算し、極端な変動はクランプ
  const dt = prevT? Math.max(1/240, Math.min(0.25, now-prevT)) : 1/60;
  prevT = now;

  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#0d1016';
  ctx.fillRect(0,0,w,h);

  // ディスク本体（完全透過の背景）
  const diskRadius = rMax + 8;
  ctx.beginPath();
  ctx.arc(cx, cy, diskRadius, 0, 2*Math.PI);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(220,235,255,0.18)';
  ctx.stroke();

  // 物理に使う入力
  // - 再生: ファイル由来 + ライブ入力
  // - トレーナ: ライブ入力のみ（ターゲットは描画だけ）
  const liveAndTap = mergeNoteMaps(liveNotes, tapNotes, lockedTouchNotes);
  updateAnalysisSourceStatus(liveAndTap.size > 0, fileNotes.size > 0);
  const physicsPoints = (fileOp.value==='play')
    ? [...mapToPoints(liveAndTap),
       ...mapToPoints(fileNotes)]
    : [...mapToPoints(liveAndTap)];

  const hasPhysInput = physicsPoints.length>0;
  // 物理計算に使えるノートがあるかどうかを示すフラグ

  // 物理
  const tau = hasPhysInput ? torqueFromPoints(physicsPoints, GRAV_ABS, rMax, step, minRadius, displayMinFreq, displayMaxFreq, excludeMode) : 0;
  // トルクを質量で割って角加速度を求める
  const alpha = tau / Math.max(1e-6, diskMass);
  if (snapZeroAlpha && Math.abs(alpha) < 1e-6){
    diskOmega = 0;
  }else{
    diskOmega += alpha * dt;
  }

  // ダンピング：1秒あたり (1 - p%)^dt
  const k = Math.max(0, Math.min(1, 1 - dampPerSec));
  diskOmega *= Math.pow(k, dt);

  // 最大回転速度（対数スライダで設定）
  if(diskOmega > omegaMax) diskOmega = omegaMax;
  else if(diskOmega < -omegaMax) diskOmega = -omegaMax;

  diskAngle += diskOmega * dt;

  // 表示座標と音楽理論上の座標を分離する。
  // ディスク固定では画面座標系（Y軸下向き）で水面全体を回し、ディスクとの相対関係を水面固定時と一致させる。
  const anchor = anchorSel.value;                 // 'water' | 'disk'
  const drawRot = (anchor==='water') ? diskAngle : 0;
  const logicalHalfCenter = (anchor==='water') ? GRAV_ABS : (GRAV_ABS + diskAngle);
  const halfCenter = circleViewAngle(logicalHalfCenter);
  // K1/K2、移動ド、Dark/Bright、独自表記は表示モードに関係なく同じ論理座標で計算する。
  const theoryDrawRot = diskAngle;
  const theoryHalfCenter = GRAV_ABS;
  const activeNotes = mergeNoteMaps(liveNotes, tapNotes, lockedTouchNotes, fileNotes);
  const k2Info = k2Analysis(activeNotes, theoryDrawRot, theoryHalfCenter, 'theory');
  const compositionSummaryRaw = noteCompositionSummary(activeNotes, theoryDrawRot, theoryHalfCenter);
  if(compositionSummaryRaw) lastCompositionSummary = compositionSummaryRaw;
  const compositionSummary = compositionSummaryRaw || lastCompositionSummary;
  const chordSummaryRaw = buildChordDisplaySummary(compositionSummaryRaw);
  if(chordSummaryRaw) lastChordSummary = chordSummaryRaw;
  const chordSummary = chordSummaryRaw || lastChordSummary;
  worldRot = drawRot;

  info.textContent = `disk | τ=${tau.toFixed(3)} α=${alpha.toFixed(3)} ω=${diskOmega.toFixed(3)} rad/s`;
  drawOuterAngleHighlights(compositionSummaryRaw, drawRot, halfCenter, rMax, theoryDrawRot, theoryHalfCenter);

  // 放射線
  ctx.save(); ctx.translate(cx,cy);
  // 完全5度圏に基づく放射線を一度に描き、A音だけを強調表示
  const highlightAIndex = FIFTH_INDEX[9];
  for(let k2=0;k2<12;k2++){
    const ang = visualAngleFromFifthIndex(k2, drawRot);
    const isA = (k2 === highlightAIndex);
    ctx.beginPath();
    ctx.strokeStyle = isA ? 'rgba(0,140,140,0.95)' : 'rgba(255,255,255,0.18)';
    ctx.lineWidth = isA ? 3 : 1.5;
    ctx.moveTo(0,0); ctx.lineTo((rMax+6)*Math.cos(ang),-(rMax+6)*Math.sin(ang));
    ctx.stroke();
  }
  ctx.restore();

  // 同心円
  ctx.strokeStyle='rgba(255,255,255,0.22)';
  ctx.lineWidth = 1.5;
  for(let i=0;i<=octaves;i++){
    const rRaw = rMax - i*step;
    const radius = Math.max(minRadius, Math.min(rMax, rRaw));
    if(radius <= 0) continue; // iOS Safari throws if radius is 0 or negative
    // 半径が負にならないように安全策を入れつつ同心円を描く
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, 2*Math.PI);
    ctx.stroke();
  }
  ctx.lineWidth = 1;

  if(440 >= displayMinFreq && 440 <= displayMaxFreq){
    // 標準ピッチA4=440Hzの位置を特別なリングで示す
    const r440 = radiusFromFreq(440, rMax, step);
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(00,100,100,0.9)';
    ctx.lineWidth = 3;
    ctx.arc(cx, cy, r440, 0, 2*Math.PI);
    ctx.stroke();
  }
  ctx.lineWidth = 1;

  // 水面半円＋移動ド数字
  const halfPlanePath = (centerAngle, radius)=>{
    const p = new Path2D();
    p.moveTo(0,0);
    p.arc(0,0, radius, centerAngle - Math.PI/2, centerAngle + Math.PI/2, false);
    p.closePath();
    return p;
  };
  ctx.save(); ctx.translate(cx,cy);
  const k1Path = halfPlanePath(halfCenter, rMax+6);
  ctx.fillStyle=`rgba(0,128,255,${waterAlpha})`; ctx.fill(k1Path);
  ctx.beginPath();
  ctx.arc(0,0, rMax+6, halfCenter - Math.PI/2, halfCenter + Math.PI/2);
  ctx.strokeStyle=`rgba(0,128,255,${waterAlpha})`; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();

  if(k2Info){
    const k2Center = halfCenter + circleViewSign() * (k2Info.rawDeltaDeg * Math.PI / 180);
    ctx.save(); ctx.translate(cx,cy);
    const k2Path = halfPlanePath(k2Center, rMax+6);
    // K2（赤）は K1（青）との重なりを除外して描画する
    ctx.clip(k2Path);
    const outsideK1 = new Path2D();
    outsideK1.rect(-cv.width, -cv.height, cv.width*2, cv.height*2);
    outsideK1.addPath(k1Path);
    ctx.clip(outsideK1, 'evenodd');
    ctx.fillStyle=`rgba(255,0,0,${k2WaterAlpha})`;
    ctx.fill(k2Path);
    ctx.beginPath();
    ctx.arc(0,0, rMax+6, k2Center - Math.PI/2, k2Center + Math.PI/2);
    const k2StrokeAlpha = Math.min(1, 0.25 + k2WaterAlpha);
    ctx.strokeStyle=`rgba(255,80,80,${k2StrokeAlpha})`;
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.restore();
  }

  drawConcentricArcGuides(cx, cy, drawRot, rMax, step, minRadius, displayMinFreq, displayMaxFreq);

  // 外周ラベル
  const fontPx = labelFontPx * devicePixelRatio * 0.95;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = `${fontPx}px system-ui`;
  for(let k2=0;k2<12;k2++){
    const ang = visualAngleFromFifthIndex(k2, drawRot);
    const tx = cx + (rMax+18)*Math.cos(ang), ty = cy - (rMax+18)*Math.sin(ang);
    const text = FIFTH_LABELS[k2];
    const pc = FIFTH_ORDER_PCS[k2]; const [r,g,b] = NOTE_BG[pc];
    const m = ctx.measureText(text);
    const padX = 6*devicePixelRatio, padY = 3*devicePixelRatio;
    const wbg = m.width + padX*2, hbg = fontPx + padY*2;
    const vx = tx - cx, vy = ty - cy;
    const safeX = (w/2) - (wbg/2 + 2*devicePixelRatio);
    const safeY = (h/2) - (hbg/2 + 2*devicePixelRatio);
    const sx = Math.min(1, Math.abs(vx)>0 ? safeX/Math.abs(vx) : 1);
    const sy = Math.min(1, Math.abs(vy)>0 ? safeY/Math.abs(vy) : 1);
    const s  = Math.min(sx, sy);
    const tx2 = cx + vx*s, ty2 = cy + vy*s;
    ctx.fillStyle = `rgba(${r},${g},${b},${labelBgAlpha})`;
    ctx.fillRect(tx2 - wbg/2, ty2 - hbg/2, wbg, hbg);
    if(labelTextAlpha>0){
      ctx.lineWidth = Math.max(1, 2 * devicePixelRatio);
      ctx.strokeStyle='rgba(0,0,0,0.9)';
      ctx.strokeText(text, tx2, ty2);
      ctx.fillStyle=`rgba(255,255,255,${labelTextAlpha})`;
      ctx.fillText(text, tx2, ty2);
    }
  }
  drawMovableDoNumbers(logicalHalfCenter, rMax, cx, cy);

  // 入力の可視化
  const livePts = mapToPoints(mergeNoteMaps(liveNotes, tapNotes, lockedTouchNotes));
  const filePts = mapToPoints(fileNotes);
  let baseMidi = null;
  let lowestMidi = null;
  let highestMidi = null;
  for(const midi of activeNotes.keys()){
    if(baseMidi == null || midi < baseMidi) baseMidi = midi;
    if(lowestMidi == null || midi < lowestMidi) lowestMidi = midi;
    if(highestMidi == null || midi > highestMidi) highestMidi = midi;
  }
  if(baseMidi != null) lastKeyboardBaseMidi = baseMidi;
  if(livePts.length) drawNotes(livePts, drawRot);
  if(filePts.length && fileOp.value==='play') drawNotes(filePts, drawRot);

  // ★トレーナーのターゲット表示（trainer.currentNotesを直接描画）
  if(workspaceMode==='train' && fileOp.value==='train' && trainer && trainer.active){
    const tn = trainer.currentNotes();
    if(tn && tn.length) drawTargetNotes(tn, drawRot, trainer.hitNotes);
  }

  // 鍵盤を先に描き、情報欄を後から描く。右側情報が鍵盤に隠れないようにする。
  // 通常利用では最後の有効な角度カードを保持し、練習中だけ現在入力へ限定する。
  const keyboardCompositionSummary = workspaceMode === 'train' ? compositionSummaryRaw : compositionSummary;
  drawKeyboard(
    displayMinFreq,
    displayMaxFreq,
    (baseMidi != null ? baseMidi : lastKeyboardBaseMidi),
    drawRot,
    halfCenter,
    lowestMidi,
    highestMidi,
    keyboardCompositionSummary,
    theoryDrawRot,
    theoryHalfCenter
  );
  // 左側コード欄は従来どおり見切れを許容し、右側情報欄を最後に描いて可視性を保つ。
  const visibleChordSummary = workspaceMode === 'train' ? chordSummaryRaw : chordSummary;
  const visibleCompositionSummary = workspaceMode === 'train' ? compositionSummaryRaw : compositionSummary;
  if(chordDisplayLevel > 0){
    drawChordOverlay(visibleChordSummary, chordDisplayLevel === 2);
  }
  if(researchDetailsVisible) drawCompositionOverlay(visibleCompositionSummary);

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ===== Audio ctx & synth ===== */
let audioCtx=null;
// 再利用できるAudioContextを返し、存在しない場合は新規作成
function ensureCtx(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000}); return audioCtx; }
class PolySynth{
  constructor(ctx){
    this.ctx=ctx;
    this.masterGain=0.9;
    this.master=ctx.createGain();
    this.master.gain.value=this.masterGain;
    this.master.connect(ctx.destination);
    this.voices=new Map();
    this.muted=false;
  }
  // ノートオン時に2つのオシレータとローパスフィルタを構成し、ADSRでゲインを制御
  noteOn(midi, vel=1, when=null){
    const t = (when!=null)? when : this.ctx.currentTime;
    if(this.voices.has(midi)) this.noteOff(midi, t);
    const f=midiToHz(midi);
    const g=this.ctx.createGain(); g.gain.setValueAtTime(0,t);
    const o1=this.ctx.createOscillator(), o2=this.ctx.createOscillator();
    o1.type='sawtooth'; o2.type='square'; o1.frequency.setValueAtTime(f,t); o2.frequency.setValueAtTime(f,t); o2.detune.setValueAtTime(+3,t);
    const flt=this.ctx.createBiquadFilter(); flt.type='lowpass'; flt.frequency.setValueAtTime(3000,t); flt.Q.setValueAtTime(0.7,t);
    o1.connect(flt); o2.connect(flt); flt.connect(g); g.connect(this.master);
    const A=0.005,D=0.12,S=0.25+0.5*vel,R=0.32,peak=0.8*vel;
    g.gain.linearRampToValueAtTime(peak, t+A);
    g.gain.linearRampToValueAtTime(S*peak, t+A+D);
    o1.start(t); o2.start(t);
    this.voices.set(midi,{o1,o2,g,flt,R});
  }
  // ノートオフ時はターゲット減衰を設定し、一定時間後にノードを破棄
  noteOff(midi, when=null){
    const v=this.voices.get(midi); if(!v) return;
    const t=(when!=null)? when : this.ctx.currentTime, R=v.R;
    v.g.gain.setTargetAtTime(0,t,R/3);

/* ===== Disk torque ===== */
function torqueFromPoints(points, gravAbs, rMax, step, minRadius, minFreq, maxFreq, excludeMode){
  let tau = 0;
  for(const p of points){
    const thAbs = angleForMidiAbs(p.midi);  // ディスク絶対角
    const freq = midiToHz(p.midi);
    const r = radiusFromFreq(freq, rMax, step, minRadius);
    const rn = r / rMax;
    const d = shortestDelta(gravAbs, thAbs);
    const absd = Math.abs(d);

    // 除外側だけを±1°だけ広げる
    let excluded;
    if (excludeMode === 'filled'){
      excluded = absd <= (Math.PI/2 + EXCLUDE_PAD_RAD);
    }else{
      excluded = absd >= (Math.PI/2 - EXCLUDE_PAD_RAD);
    }
    if (excluded) continue;

    // ベロシティを0〜1に正規化し、半径と角度差からトルク寄与を計算
    const m = Math.max(0, Math.min(1, p.vel));
    tau += m * rn * Math.sin(d);
  }
  return tau;
}

async function fileToArrayBuffer(file){

async function handlePickedFile(file, {source = "user"} = {}){
  const loadGeneration = ++midiLoadGeneration;
  try{
    uiLog(`picked: ${file?.name || '(no name)'}  type:${file?.type || 'unknown'}  size:${file?.size || 0}B`);
    if(!file) throw new Error('no file');
    // ファイルをArrayBufferへ変換し、MIDIパーサに渡す準備をする
    const ab = await fileToArrayBuffer(file);
    if(!ab) throw new Error('arrayBuffer empty');

    const fingerprint = await midiFingerprint(ab);
    if(loadGeneration !== midiLoadGeneration) return;
    const parsed = parseMIDI(ab);
    if(!parsed || !parsed.notes) throw new Error('parse failed');
    if(loadGeneration !== midiLoadGeneration) return;

    const recoveredDraftMatches = pendingCaptureDraft?.midi?.fingerprint === fingerprint;
    const currentMidiMatches = !!currentMidiFingerprint && currentMidiFingerprint === fingerprint;
    if(source === "startup" && pendingCaptureDraft && !recoveredDraftMatches){
      setCaptureRecoveryMessage('captureDraftHeld', {name:pendingCaptureDraft.midi.name});
      uiLog(tf('captureRestoringLog', {name:pendingCaptureDraft.midi.name}));
      updateCaptureUI();
      return;
    }

    const preserveRecords = recoveredDraftMatches || currentMidiMatches;
    const hadPreviousRecords = chordCaptures.length || sectionMarkers.length;
    if(!preserveRecords){
      chordCaptures = [];
      sectionMarkers = [];
      pendingCaptureDraft = null;
      removeStoredCaptureDraft();
    }
    midiDataRaw = parsed;
    lastChordSummary = null;
    lastCompositionSummary = null;
    currentMidiFileName = file.name || 'MIDI';
    currentMidiFingerprint = fingerprint;
    currentMidiByteLength = ab.byteLength;
    if(recoveredDraftMatches){
      pendingCaptureDraft = null;
      setCaptureRecoveryMessage('captureReconnected', {name:currentMidiFileName});
    }else if(!preserveRecords){
      applySuggestedCaptureMeter(parsed);
      if(hadPreviousRecords) setCaptureRecoveryMessage('captureClearedForDifferentMidi', {name:currentMidiFileName});
      else setCaptureRecoveryMessage();
    }
    rebuildMidiView();
    saveCaptureDraft();
    if(recoveredDraftMatches){
      setCaptureRecoveryMessage('captureReconnected', {name:currentMidiFileName});
    }
    updateCaptureUI();

    const trks = (Array.isArray(midiData.tracks) ? midiData.tracks.length : (midiData.tracks ?? 0));
    uiLog(`OK: ${file.name}  trks:${trks}  ppq:${midiData.ppq}  len:${midiData.lengthSec.toFixed(2)}s  notes:${midiData.notes.length}`);
  }catch(err){
    if(loadGeneration !== midiLoadGeneration) return;
    uiLog(`解析失敗: ${err && err.message ? err.message : err}`);
    console.error(err);
  }
}

    for(let i = 0; i < len; i++){ bytes[i] = binary.charCodeAt(i); }
    const blob = new Blob([bytes], { type: 'audio/midi' });
    let fileLike;
    try{
      fileLike = new File([blob], fileName, { type: blob.type || 'audio/midi', lastModified: Date.now() });
    }catch{
      fileLike = {
        name: fileName,
        type: blob.type || 'audio/midi',
        size: blob.size,
        arrayBuffer: () => blob.arrayBuffer()
      };
    }
    await handlePickedFile(fileLike, {source:"startup"});
  }catch(err){
    console.warn('failed to load MIDI from native:', err);
  }
}

    for(const n of data.notes || []){
      const nn = clampNote(n.note);
      if(nn==null) continue;
      notes.push({...n, note: nn});
    }
    const onsets = new Map();
    if(data.onsets){
      data.onsets.forEach((arr, tk)=>{
        const mapped = arr.map(o=>({note: clampNote(o.note), vel: o.vel})).filter(o=>o.note!=null);
        if(mapped.length) onsets.set(tk, mapped);
      });
    }
    const onsetTicks = Array.from(onsets.keys()).sort((a,b)=>a-b);
    return {...data, notes, onsets, onsetTicks, transpose: shift};
  }

  function rebuildMidiView({preservePlayback = false} = {}){
    if(!midiDataRaw) return;
    const resume = preservePlayback && player;
    const resumeCtx = resume ? player.ctx : null;
    const resumeRunning = resume ? player.running : false;
    const resumePos = resume ? player.currentPosition() : 0;
    if(player){
      player.stop();
      player = null;
    }
    midiData = applyTransposeToMIDI(midiDataRaw, midiTranspose);
    trainer = new Trainer(midiData);
    updateTrainerUI();
    updateSeekUI(resumePos, midiData.lengthSec);
    const ctx = resumeCtx || ensureCtx();
    player = new Player(ctx, midiData.notes);
    player.onProgress(updateSeekUI);
    player.setPosition(resumePos);
    if(resumeRunning) player.play();
  }

  /* ===== Player ===== */
class Player{
  constructor(ctx, notes){
    this.ctx=ctx; this.notes=notes;
    this.rate=playbackRate;
    this.events = [];
    for(const n of notes){
      this.events.push({time:n.startSec, type:'on', note:n.note, vel:n.vel/127});
      this.events.push({time:n.endSec,   type:'off', note:n.note});
    }
    this.events.sort((a,b)=>a.time-b.time);
    this.nextIdx = 0;
    this.posSec = 0;
    this.t0Ctx = 0;
    this.timer = null;
    this.lookahead = 0.1; // s
    this.running = false;
    this.timeouts = new Set();
    this.onProgressCb = null;
  }
  onProgress(cb){ this.onProgressCb = cb; }
  emitProgress(){ if(this.onProgressCb) this.onProgressCb(this.currentPosition(), this.totalLength()); }
  clearTimers(){
    if(this.timer) clearTimeout(this.timer);
    this.timer = null;
    for(const to of this.timeouts) clearTimeout(to);
    this.timeouts.clear();
  }
  clearPlayingState(){
    this.clearTimers();
    fileNotes.clear();
    if(fileSynth) fileSynth.allNotesOff();
  }
  activateHeldNotes(posSec){
    if(!this.notes || !this.notes.length) return;
    const when = this.ctx.currentTime + 0.001;
    if(!fileSynth) fileSynth=new PolySynth(this.ctx);
    applySeekMuteState();
    for(const n of this.notes){
      if(n.startSec < posSec && n.endSec > posSec){
        const vel = n.vel/127;
        fileSynth.noteOn(n.note, vel, when);
        fileNotes.set(n.note, vel);
      }
    }
  }
  currentPosition(){
    const now = this.running ? ((this.ctx.currentTime - this.t0Ctx) * this.rate) : this.posSec;
    return Math.max(0, Math.min(now, this.totalLength()));
  }
  retargetIndex(){
    const pos = this.currentPosition();
    let idx = this.events.findIndex(ev => ev.time >= pos);
    this.nextIdx = idx < 0 ? this.events.length : idx;
  }
  scheduleUntil(tCut){
    const ctx=this.ctx;
    if(!fileSynth) fileSynth=new PolySynth(ctx);
    applySeekMuteState();
    while(this.nextIdx < this.events.length && this.events[this.nextIdx].time <= tCut){
      const ev = this.events[this.nextIdx++];
      const whenAbs = this.t0Ctx + ev.time / this.rate;
      if(ev.type==='on'){
        fileSynth.noteOn(ev.note, ev.vel||0.8, whenAbs);
        const delay = Math.max(0, (whenAbs - ctx.currentTime))*1000;
        const to = setTimeout(()=>{
          fileNotes.set(ev.note, ev.vel||0.8);
          this.timeouts.delete(to);
        }, delay);
        this.timeouts.add(to);
      }else{
        fileSynth.noteOff(ev.note, whenAbs);
        const delay = Math.max(0, (whenAbs - ctx.currentTime))*1000;
        const to = setTimeout(()=>{
          fileNotes.delete(ev.note);
          this.timeouts.delete(to);
        }, delay+5);
        this.timeouts.add(to);
      }
    }
  }
  tick = ()=>{
    if(!this.running) return;
    const now = (this.ctx.currentTime - this.t0Ctx) * this.rate;
    this.scheduleUntil(now + this.lookahead * this.rate);
    this.emitProgress();
    if(now >= this.totalLength()){ this.stop(); return; }
    this.timer = setTimeout(this.tick, 20);
  }
  totalLength(){ return this.events.length? this.events[this.events.length-1].time : 0; }
  play(){
    if(this.running) return;
    this.t0Ctx = this.ctx.currentTime - this.posSec / this.rate;
    this.running = true;
    this.emitProgress();
    this.activateHeldNotes(this.posSec);
    this.scheduleUntil(this.posSec + this.lookahead * this.rate);
    this.tick();
  }
  pause(){
    if(!this.running) return;
    this.posSec = this.currentPosition();
    this.retargetIndex();
    this.running = false;
    this.clearTimers();
    this.clearPlayingState();
    this.emitProgress();
  }
  stop(){
    this.running = false; this.posSec = 0; this.nextIdx = 0;
    this.clearPlayingState();
    this.emitProgress();
  }
  setPosition(sec){
    const total = this.totalLength();
    const clamped = Math.max(0, Math.min(Number.isFinite(sec) ? sec : 0, total));
    const wasRunning = this.running;
    this.running = false;
    this.posSec = clamped;
    this.clearPlayingState();
    this.retargetIndex();
    if(wasRunning) this.play();
    else this.emitProgress();
  }
  setRate(rate){
    const nextRate = normalizePlaybackRate(rate);
    if(Math.abs(nextRate - this.rate) < 1e-9) return;
    const wasRunning = this.running;
    const pos = this.currentPosition();
    this.running = false;
    this.posSec = pos;
    this.clearPlayingState();
    this.rate = nextRate;
    this.retargetIndex();
    if(wasRunning) this.play();
    else this.emitProgress();
  }
}
/* ===== Trainer（離鍵必須のエッジ検出） ===== */
class Trainer{
  constructor(midi){
    this.midi = midi;
    this.steps = midi.onsetTicks.map(tk => ({tick:tk, notes: midi.onsets.get(tk).map(o=>o.note)}));
    this.idx = 0;
    this.active = false;
    this.started = false;
    this.completed = false;
    this.hitNotes = new Set();
    this.prevLive = new Set();
  }

  currentNotes(){ return (this.steps[this.idx]?.notes || []).slice().sort((a,b)=>a-b); }
  resetProgress(live){
    this.hitNotes.clear();
    this.prevLive = new Set(live.keys());
  }

  start(live = trainerInputState()){
    this.idx = 0;
    this.active = true;
    this.started = true;
    this.completed = false;
    this.resetProgress(live);
  }

  next(live = trainerInputState()){
    if(!this.active) return;
    this.idx++;
    if(this.idx >= this.steps.length){ this.finish(); return; }
    this.resetProgress(live);
  }

  prev(live = trainerInputState()){
    if(!this.active) return;
    this.idx = Math.max(0, this.idx-1);
    this.resetProgress(live);
  }

  finish(){ this.active = false; this.completed = true; }

  considerAdvance(live = trainerInputState()){
    if(!this.active) return;
    const targets = this.currentNotes();
    if(!targets.length){
      this.next(live);
      return;
    }
    const targetSet = new Set(targets);
    const newlyPressed = [];
    for(const [note] of live){
      if(!this.prevLive.has(note)) newlyPressed.push(note);
    }
    if(newlyPressed.length){
      let hasWrong = false;
      for(const note of newlyPressed){
        if(targetSet.has(note)){
          this.hitNotes.add(note);
        }else{
          hasWrong = true;
        }
      }
      if(hasWrong) this.hitNotes.clear();
    }
    this.prevLive = new Set(live.keys());
    const allHit = targets.every((note)=> this.hitNotes.has(note));
    if(allHit) this.next(live);
  }
}
  /* ===== UI actions ===== */

/* ===== Capture draft auto-recovery ===== */
function setCaptureRecoveryMessage(key = "", values = {}){
  captureRecoveryState = key ? {key, values:{...values}} : null;
  captureRecoveryMessage = key ? tf(key, values) : "";
}
function captureDraftStorageProbe(){
  try{
    localStorage.setItem(CAPTURE_DRAFT_PROBE_KEY, "1");
    const ok = localStorage.getItem(CAPTURE_DRAFT_PROBE_KEY) === "1";
    localStorage.removeItem(CAPTURE_DRAFT_PROBE_KEY);
    captureDraftStorageAvailable = ok;
  }catch(e){
    captureDraftStorageAvailable = false;
  }
  if(!captureDraftStorageAvailable){
    setCaptureRecoveryMessage('captureStorageUnavailable');
  }
  return captureDraftStorageAvailable;
}
function safeDraftNumber(value, fallback = 0){
  const parsed = Number(value);
  return Number.isFinite(parsed) ? parsed : fallback;
}
function sanitizeCaptureDraft(raw){
  if(!raw || raw.schemaVersion !== 1 || !raw.midi || !raw.capture) return null;
  const fingerprint = typeof raw.midi.fingerprint === "string" ? raw.midi.fingerprint : "";
  if(!/^raw-sha256-v1:[0-9a-f]{64}$/i.test(fingerprint)) return null;
  const chords = Array.isArray(raw.capture.chords) ? raw.capture.chords.map((row, index)=>({
    id: String(row?.id || `recovered-chord-${index}`),
    tick: safeDraftNumber(row?.tick),
    timeSec: safeDraftNumber(row?.timeSec),
    chord: String(row?.chord || "–"),
    degree: String(row?.degree || "–"),
    notation: String(row?.notation || "–")
  })) : [];
  const markers = Array.isArray(raw.capture.markers) ? raw.capture.markers.map((row, index)=>({
    id: String(row?.id || `recovered-marker-${index}`),
    label: ["A","B","C","D"].includes(String(row?.label || "").toUpperCase()) ? String(row.label).toUpperCase() : "A",
    tick: safeDraftNumber(row?.tick),
    timeSec: safeDraftNumber(row?.timeSec)
  })) : [];
  if(!(chords.length || markers.length)) return null;
  return {
    schemaVersion: 1,
    revision: Math.max(0, Math.floor(safeDraftNumber(raw.revision))),
    midi: {
      fingerprint,
      byteLength: Math.max(0, Math.floor(safeDraftNumber(raw.midi.byteLength))),
      name: String(raw.midi.name || "MIDI"),
      ppq: Math.max(1, Math.floor(safeDraftNumber(raw.midi.ppq, 480)))
    },
    capture: {
      chords, markers,
      meter: String(raw.capture.meter || "4/4"),
      startBeat: Math.max(1, Math.floor(safeDraftNumber(raw.capture.startBeat, 1)))
    },
    updatedAt: typeof raw.updatedAt === "string" ? raw.updatedAt : ""
  };
}
function removeStoredCaptureDraft(){
  if(!captureDraftStorageAvailable) return;
  try{ localStorage.removeItem(CAPTURE_DRAFT_KEY); }
  catch(e){ captureDraftStorageAvailable = false; }
}
function saveCaptureDraft(){
  const hasRecords = chordCaptures.length || sectionMarkers.length;
  if(!hasRecords){
    pendingCaptureDraft = null;
    removeStoredCaptureDraft();
    return;
  }
  const midiIdentity = currentMidiFingerprint ? {
    fingerprint: currentMidiFingerprint,
    byteLength: currentMidiByteLength,
    name: currentMidiFileName || "MIDI",
    ppq: midiDataRaw?.ppq || midiData?.ppq || 480
  } : pendingCaptureDraft?.midi;
  if(!midiIdentity) return;
  const snapshot = {
    schemaVersion: 1,
    revision: ++captureDraftRevision,
    midi: {...midiIdentity},
    capture: {
      chords: chordCaptures.map(row=>({...row})),
      markers: sectionMarkers.map(row=>({...row})),
      meter: captureMeter.value || "4/4",
      startBeat: Math.max(1, parseInt(captureStartBeat.value, 10) || 1)
    },
    updatedAt: new Date().toISOString()
  };
  if(!captureDraftStorageAvailable){
    setCaptureRecoveryMessage('captureStorageUnavailable');
    return;
  }
  try{
    localStorage.setItem(CAPTURE_DRAFT_KEY, JSON.stringify(snapshot));
    if(!currentMidiFingerprint) pendingCaptureDraft = snapshot;
    if(currentMidiFingerprint) setCaptureRecoveryMessage('captureAutosaved');
    else setCaptureRecoveryMessage('captureRestoring', {name:snapshot.midi.name});
  }catch(e){
    captureDraftStorageAvailable = false;
    setCaptureRecoveryMessage('captureAutoSaveFailed');
  }
}
function loadCaptureDraft(){
  if(!captureDraftStorageProbe()) return;
  let draft = null;
  try{ draft = sanitizeCaptureDraft(JSON.parse(localStorage.getItem(CAPTURE_DRAFT_KEY) || "null")); }catch(e){}
  if(!draft) return;
  pendingCaptureDraft = draft;
  captureDraftRevision = draft.revision;
  chordCaptures = draft.capture.chords;
  sectionMarkers = draft.capture.markers;
  currentMidiFileName = draft.midi.name;
  if(Array.from(captureMeter.options).some(option=>option.value===draft.capture.meter)){
    captureMeter.value = draft.capture.meter;
  }
  rebuildStartBeatOptions(false);
  captureStartBeat.value = String(Math.min(meterParts().numerator, draft.capture.startBeat));
  setCaptureRecoveryMessage('captureRestored', {name:draft.midi.name});
}
function updateCaptureRecoveryStatus(){
  if(!captureRecoveryStatus) return;
  if(captureRecoveryState){
    captureRecoveryMessage = tf(captureRecoveryState.key, captureRecoveryState.values);
  }

}

function rebuildStartBeatOptions(keep=true){

function applySuggestedCaptureMeter(data){

  if(ts){

function captureLocation(tick){
  const {numerator, denominator}=meterParts();
  const capturePPQ=midiData?.ppq || pendingCaptureDraft?.midi?.ppq || 480;
  const beatTicks=capturePPQ * 4 / denominator;
  const rawBeat=Math.max(0,tick)/beatTicks;
  const startBeat=Math.max(1,parseInt(captureStartBeat.value,10)||1);
  const pickupLength=startBeat===1 ? 0 : numerator-startBeat+1;
  if(rawBeat < pickupLength - 1e-9){ return {section:'prelude', measure:null, beat:startBeat+rawBeat}; }
  const shifted=Math.max(0,rawBeat-pickupLength);
  const measure=Math.floor((shifted+1e-9)/numerator)+1;
  const beat=(shifted % numerator)+1;
  return {section:String(measure).padStart(3,'0'), measure, beat};
}

function captureEntryText(row, loc, widths, options){

  if(options.showDegree) parts.push(String(row.degree || '–').padEnd(widths.degree,' '));
  // 再生時間は一般的なコード名の直前に置く。
  if(options.showTime) parts.push(formatCaptureTime(row.timeSec).padEnd(widths.time,' '));
  if(options.showChord) parts.push(String(row.chord || '–'));
  return parts.join('  ').trimEnd();
}
function captureMarkerText(marker, loc, widths, options){
  const parts=[];
  if(options.showBeat) parts.push(formatBeat(loc.beat).padEnd(widths.beat,' '));
  if(options.showTime) parts.push(formatCaptureTime(marker.timeSec).padEnd(widths.time,' '));
  parts.push(`【${marker.label}】`);
  return parts.join('  ').trimEnd();
}
function buildCaptureText(){
  const {numerator,denominator}=meterParts();
  const startBeat=Math.max(1,parseInt(captureStartBeat.value,10)||1);
  const options=captureOutputOptions();
  const rows=[...chordCaptures].sort((a,b)=>a.tick-b.tick || a.timeSec-b.timeSec);
  const markers=options.showMarkers
    ? [...sectionMarkers].sort((a,b)=>a.tick-b.tick || a.timeSec-b.timeSec)
    : [];
  const widths={
    beat:5,
    notation:Math.max(8,...rows.map(row=>String(row.notation || '–').length)),
    degree:Math.max(6,...rows.map(row=>String(row.degree || '–').length)),
    time:Math.max(9,...rows.map(row=>formatCaptureTime(row.timeSec).length),...markers.map(row=>formatCaptureTime(row.timeSec).length))
  };
  const lines=[];
  if(options.showHeader){
    lines.push(
      t('captureExportTitle'),
      '',
      `${t('captureExportFile')}: ${currentMidiFileName || '–'}`,
      `${t('captureExportMeter')}: ${numerator}/${denominator}`,
      `${t('captureExportStartBeat')}: ${startBeat}`,
      ''
    );
  }
  const showAnyChordField=options.showBeat || options.showNotation || options.showDegree || options.showTime || options.showChord;
  const events=[
    ...(showAnyChordField ? rows.map(row=>({kind:'chord',tick:row.tick,timeSec:row.timeSec,row})) : []),
    ...markers.map(marker=>({kind:'marker',tick:marker.tick,timeSec:marker.timeSec,marker}))
  ].sort((a,b)=>{
    const byPosition=a.tick-b.tick || a.timeSec-b.timeSec;
    if(byPosition) return byPosition;
    if(a.kind===b.kind) return 0;
    return a.kind==='marker' ? -1 : 1;
  });
  if(!events.length){
    const hasAnyRecord=chordCaptures.length || sectionMarkers.length;
    lines.push(hasAnyRecord ? t('captureNoVisibleFields') : t('captureNoRecords'));
    return lines.join('\n');
  }
  const grouped=[];
  let current=null;
  for(const event of events){
    const loc=captureLocation(event.tick);
    if(!current || current.section!==loc.section){
      current={section:loc.section, entries:[]};
      grouped.push(current);
    }
    current.entries.push({event,loc});
  }
  for(let gi=0;gi<grouped.length;gi++){
    const group=grouped[gi];
    const heading=group.section==='prelude' ? `[${t('capturePrelude')}]` : `[${group.section}]`;
    const entryText=({event,loc})=>event.kind==='marker'
      ? captureMarkerText(event.marker,loc,widths,options)
      : captureEntryText(event.row,loc,widths,options);
    if(options.layout==='measure'){
      const body=group.entries.map(entryText).filter(Boolean).join(' | ');
      lines.push(body ? `${heading} ${body}` : heading);
    }else{
      lines.push(heading);
      for(const entry of group.entries){
        const body=entryText(entry);
        if(body) lines.push(body);
      }
      if(gi<grouped.length-1) lines.push('');
    }
  }
  return lines.join('\n');
}
function updateCapturePreview(){ capturePreview.value=buildCaptureText(); }
function updateCaptureUI(){
  const enabled=!!midiData && workspaceMode === 'play';
  if(captureNowBtn) captureNowBtn.disabled=!enabled;
  if(captureRevealBtn) captureRevealBtn.disabled=!enabled;
  captureMarkerButtons.forEach(button=>{ button.disabled=!enabled; });
  const totalRecords=chordCaptures.length+sectionMarkers.length;
  captureCount.textContent=tf('captureCount', {chords:chordCaptures.length, sections:sectionMarkers.length});
  captureClearBtn.disabled=!totalRecords;
  if(!totalRecords) resetCaptureClearButton();
  captureShareBtn.disabled=!totalRecords;
  if(captureSummary){
    const latestEvents=[
      ...chordCaptures.map(row=>({kind:'chord',tick:row.tick,timeSec:row.timeSec,row})),
      ...sectionMarkers.map(marker=>({kind:'marker',tick:marker.tick,timeSec:marker.timeSec,marker}))
    ].sort((a,b)=>a.tick-b.tick || a.timeSec-b.timeSec);
    const latest=latestEvents[latestEvents.length-1];
    if(latest){
      const loc=captureLocation(latest.tick);
      const where=`${loc.section==='prelude' ? t('capturePrelude') : loc.section}:${formatBeat(loc.beat)}`;
      captureSummary.textContent=latest.kind==='marker'
        ? tf('captureSummaryMarker', {total:totalRecords, where, marker:latest.marker.label})
        : tf('captureSummaryChord', {total:totalRecords, where, notation:latest.row.notation || '–', chord:latest.row.chord || '–'});
    }else{
      captureSummary.textContent=t('captureEmptySummary');
    }
  }
  updateCapturePreview();
  updateCaptureRecoveryStatus();
}
function openCapturePanel(){
  if(workspaceMode !== 'play') return;
  updateCaptureUI();
  capturePanel.classList.add('open');
  capturePanel.setAttribute('aria-hidden','false');
}
function closeCapturePanel(){ capturePanel.classList.remove('open'); capturePanel.setAttribute('aria-hidden','true'); }
async function exportCaptureText(){
  const text=buildCaptureText();
  const base=(currentMidiFileName || 'MIDI').replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|]+/g,'_');
  const filename=`${base}_Chord_Capture.txt`;
  if(window.webkit?.messageHandlers?.exportText){
    window.webkit.messageHandlers.exportText.postMessage({filename,text});
    return;
  }
  try{
    const file=new File([text],filename,{type:'text/plain;charset=utf-8'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:filename}); return; }
  }catch(e){}
  const blob=new Blob([text],{type:'text/plain;charset=utf-8'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
let captureClearArmedUntil = 0;
let captureClearResetTimer = null;
function resetCaptureClearButton(){
  captureClearArmedUntil = 0;
  if(captureClearResetTimer){ clearTimeout(captureClearResetTimer); captureClearResetTimer=null; }
  if(captureClearBtn) captureClearBtn.textContent=t('captureDeleteAll');
}
function requestClearCaptures(){
  if(!(chordCaptures.length || sectionMarkers.length)){ showCaptureToast(t('captureNoDelete')); return; }
  const now=Date.now();
  if(now < captureClearArmedUntil){
    chordCaptures.splice(0, chordCaptures.length);
    sectionMarkers.splice(0, sectionMarkers.length);
    resetCaptureClearButton();
    saveCaptureDraft();
    setCaptureRecoveryMessage('captureRecordsCleared');
    updateCaptureUI();
    showCaptureToast(t('captureDeletedAll'));
    return;
  }
  captureClearArmedUntil = now + 3500;
  captureClearBtn.textContent=t('captureDeleteConfirmButton');
  showCaptureToast(t('captureDeleteConfirmToast'));
  captureClearResetTimer=setTimeout(resetCaptureClearButton,3500);
}
function bindRapidActionButton(button, action){
  if(!button || typeof action!=='function') return;
  let lastTouchAt=-Infinity;
  button.addEventListener('touchend',(e)=>{
    if(button.disabled) return;
    e.preventDefault();
    e.stopPropagation();
    lastTouchAt=performance.now();
    action();
  },{passive:false});
  button.addEventListener('click',(e)=>{
    if(performance.now()-lastTouchAt < 700){ e.preventDefault(); return; }
    action();
  });
}
// iOSのダブルタップ拡大を抑止し、素早い連続記録を優先する。
document.addEventListener('dblclick',(e)=>e.preventDefault(),{passive:false});

captureListBtn.addEventListener('click',openCapturePanel);
bindRapidActionButton(captureNowBtn,captureCurrentChord);
bindRapidActionButton(captureRevealBtn,captureCurrentChord);
captureMarkerButtons.forEach(button=>{
  bindRapidActionButton(button,()=>captureSectionMarker(button.dataset.marker));
});
captureClearBtn.addEventListener('click',requestClearCaptures);
captureCloseBtn.addEventListener('click',closeCapturePanel);
capturePanel.addEventListener('click',(e)=>{if(e.target===capturePanel)closeCapturePanel();});
captureMeter.addEventListener('change',()=>{rebuildStartBeatOptions(true);saveCaptureDraft();updateCaptureUI();});
captureStartBeat.addEventListener('change',()=>{saveCaptureDraft();updateCaptureUI();});
[captureLayout,captureShowBeat,captureShowNotation,captureShowChord,captureShowDegree,captureShowTime,captureShowMarkers,captureShowHeader].forEach(el=>{
  if(el) el.addEventListener('change',()=>{saveCaptureOutputOptions();updateCaptureUI();});
});
captureShareBtn.addEventListener('click',exportCaptureText);
loadCaptureOutputOptions();
rebuildStartBeatOptions(false);
loadCaptureDraft();
updateCaptureUI();
addEventListener('pagehide', saveCaptureDraft);

/* ===== Keyboard shortcuts ===== */
addEventListener('keydown', e=>{
  const target = e.target;
  const editing = target && (["INPUT","SELECT","TEXTAREA"].includes(target.tagName) || target.isContentEditable);
  if(!editing && workspaceMode==='train' && fileOp.value==='train' && trainer && trainer.active){
    if(e.key==='ArrowLeft'){ e.preventDefault(); trainer.prev(trainerInputState()); updateTrainerUI(); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); trainer.next(trainerInputState()); updateTrainerUI(); }
  }
});
</script>
