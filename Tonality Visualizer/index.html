<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Polar Pitch Map — Disk physics, MIDI In + MIDI File</title>
<style>
  html,body{
    margin:0;height:100%;background:#111;color:#ddd;font:14px system-ui;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  :root{ --ui-scale:1; }
  #ui{position:fixed;top:calc(max(6px,env(safe-area-inset-top)) + 92px);right:8px;left:auto;z-index:6;display:block;box-sizing:border-box;
       width:min(380px,calc(100vw - 16px));max-height:calc(100vh - 114px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
       overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;
       border:1px solid rgba(255,255,255,.2);border-radius:14px;background:rgba(12,16,23,.96);
       box-shadow:0 12px 38px rgba(0,0,0,.46);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
       transform-origin:top right;transform:scale(var(--ui-scale));}
  body.ios #ui{transform:none}
  #ui .sep{display:none}
  #settingsHeader{
    position:sticky;top:-10px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin:-10px -10px 10px;padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.16);
    background:rgba(12,16,23,.98);box-shadow:0 5px 14px rgba(0,0,0,.28)
  }
  #settingsHeader #langWrap{flex:1 1 auto;min-width:0;font-weight:750}
  #settingsHeader #lang{min-width:0;max-width:190px;min-height:44px;flex:1 1 auto}
  #settingsCloseBtn{flex:0 0 auto;min-height:44px;border:1px solid rgba(147,197,253,.55);border-radius:9px;background:#263750;color:#f8fafc;font-weight:750}
  .settings-section{margin:0 0 8px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.025)}
  .settings-section>summary{cursor:pointer;padding:10px 11px;min-height:44px;box-sizing:border-box;font-weight:750;list-style-position:inside}
  .settings-section-content{display:grid;gap:10px;padding:4px 11px 12px}
  .settings-section-content>label{justify-content:space-between;min-height:40px}
  .settings-section-content>button{justify-self:start;min-height:40px}
  .settings-section-content input[type=range]{width:min(180px,48vw)}
  #circleOrder{max-width:min(190px,52vw)}
  canvas{
    display:block;width:100vw;height:100vh;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  label{display:flex;gap:6px;align-items:center;touch-action:manipulation}
  input[type=range]{width:180px}
  button,select{padding:6px 10px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .sep{width:1px;height:22px;background:#444;margin:0 4px}

  /* 目的を先に選べる常設ナビゲーション */
  #appBar{position:fixed;top:max(6px,env(safe-area-inset-top));left:8px;right:8px;height:54px;z-index:7;
    display:flex;align-items:center;gap:7px;box-sizing:border-box;padding:5px 7px;border:1px solid rgba(255,255,255,.16);
    border-radius:13px;background:rgba(12,16,23,.92);box-shadow:0 4px 20px rgba(0,0,0,.32);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow-x:auto;white-space:nowrap}
  #appBrand{font-weight:800;letter-spacing:.01em;padding:0 5px;color:#f8fafc}
  #purposeNav{display:flex;align-items:center;gap:4px}
  #appBar button{min-height:44px;padding:6px 10px;border:1px solid rgba(255,255,255,.16);border-radius:9px;background:#222a36;color:#e5e7eb}
  #appBar button:focus-visible,.settings-section>summary:focus-visible,#ui button:focus-visible,#ui input:focus-visible,#ui select:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
  #appBar button:hover{background:#2c3746}
  #purposeNav button[aria-selected="true"]{background:#2563eb;border-color:#60a5fa;color:#fff}
  #candidateToggle[data-display-level="hidden"]{background:#1b2029;border-color:rgba(255,255,255,.10);color:#9ca3af}
  #candidateToggle[data-display-level="summary"]{background:#263750;border-color:#60a5fa;color:#eff6ff}
  #candidateToggle[data-display-level="candidates"],#researchToggle[aria-pressed="true"]{background:#374151;border-color:#9ca3af}
  #analysisSourceStatus{padding:0 6px;color:#bfdbfe;font-size:12px}
  #uiToggle,#diskLock{position:static;z-index:auto;opacity:1}
  #landscapeNavToggle{
    position:fixed;top:max(6px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));
    z-index:9;display:none;width:44px;height:44px;min-width:44px;min-height:44px;padding:0;box-sizing:border-box;
    align-items:center;justify-content:center;border:1px solid rgba(147,197,253,.62);
    border-radius:10px;background:rgba(38,55,80,.96);color:#eff6ff;font-size:21px;font-weight:800;
    box-shadow:0 4px 16px rgba(0,0,0,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
  }
  #landscapeNavToggle[hidden]{display:none!important}
  #landscapeNavToggle[aria-expanded="true"]{background:rgba(55,65,81,.98)}
  #appBar[hidden]{display:none!important}
  body.app-bar-hidden #appBar{visibility:hidden;opacity:0;pointer-events:none}
  body.app-bar-hidden #landscapeNavToggle{
    position:fixed;display:flex;min-width:44px;min-height:44px
  }
  body:not(.ui-hidden)::before{content:"";position:fixed;inset:0;z-index:5;background:rgba(2,6,12,.56);pointer-events:none}
  @media(max-width:760px){
    #appBrand{display:none}
    #appBar{right:6px;left:6px;height:88px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));
      grid-template-rows:40px 40px;gap:2px;padding:2px 5px;overflow:visible;white-space:normal}
    #purposeNav{grid-column:1/-1;grid-row:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
    #appBar button{min-width:0;min-height:40px;height:40px;padding:4px 3px;font-size:12px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #purposeNav button{white-space:normal;text-overflow:clip}
    #appBar #openMidiQuick{grid-column:1/3;grid-row:2;white-space:normal;text-overflow:clip;line-height:1.05}
    #appBar #candidateToggle{grid-column:3/6;grid-row:2;white-space:normal;text-overflow:clip}
    #researchToggle{grid-column:6/8;grid-row:2}
    #diskLock{grid-column:8/11;grid-row:2}
    #uiToggle{grid-column:11/13;grid-row:2}
    #analysisSourceStatus{display:none}
    #ui{top:calc(max(6px,env(safe-area-inset-top)) + 128px);right:6px;width:calc(100vw - 12px);
      max-height:calc(100vh - 146px - env(safe-area-inset-top) - env(safe-area-inset-bottom));transform:none}
    .settings-section-content{gap:8px;padding-inline:9px}
    .settings-section-content>label{gap:5px;min-height:44px}
    .settings-section-content input[type=range]{width:min(156px,40vw)}
    #midiFile{max-width:min(218px,58vw)}
  }
  @media (max-height:500px) and (orientation:landscape){
    #appBrand{display:none}
    /*
      低い横画面ではナビを一時表示の2段オーバーレイにする。
      円盤の幾何からは除外し、短辺方向を可視化へ返す。
    */
    #appBar{
      top:calc(max(6px,env(safe-area-inset-top)) + 52px);
      left:auto;
      right:max(8px,env(safe-area-inset-right));
      width:min(720px,calc(100vw - max(8px,env(safe-area-inset-left)) - max(8px,env(safe-area-inset-right))));
      max-width:calc(100vw - max(8px,env(safe-area-inset-left)) - max(8px,env(safe-area-inset-right)));height:94px;
      display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:44px 44px;
      align-items:stretch;gap:2px;padding:2px 5px;
      overflow:visible;white-space:normal;
      transition:opacity .14s ease,transform .14s ease,visibility .14s linear;
    }
    #purposeNav{
      grid-column:1/-1;grid-row:1;display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));gap:4px
    }
    #appBar button{
      min-width:0;min-height:44px;height:44px;padding:3px 4px;font-size:12px;line-height:1.05;
      overflow:hidden;text-overflow:clip;white-space:normal
    }
    #appBar #openMidiQuick{grid-column:1/3;grid-row:2}
    #appBar #candidateToggle{grid-column:3/6;grid-row:2}
    #appBar #researchToggle{grid-column:6/8;grid-row:2}
    #appBar #diskLock{grid-column:8/11;grid-row:2}
    #appBar #uiToggle{grid-column:11/13;grid-row:2;position:static;margin:0;box-shadow:none}
    #analysisSourceStatus{display:none}
    body.landscape-nav-collapsed #appBar{
      visibility:hidden;opacity:0;transform:translateY(-10px);pointer-events:none
    }
    #landscapeNavToggle{position:fixed;display:flex;min-width:44px;min-height:44px}
    #landscapeNavToggle[aria-expanded="true"]{box-shadow:none}
  }

  /* UIを隠しても残る、MIDI再生・トレーナー用の小型操作部 */
  #transportDock{
    position:fixed;
    left:50%;
    bottom:max(8px, env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:4;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:8px;
    box-sizing:border-box;
    max-width:calc(100vw - 16px);
    padding:7px 10px;
    border:1px solid rgba(255,255,255,0.18);
    border-radius:12px;
    background:rgba(12,16,23,0.86);
    box-shadow:0 4px 18px rgba(0,0,0,0.35);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  #transportDock button{min-width:42px;min-height:36px}
  #transportDock label{white-space:nowrap}
  #transportDock input[type=range]{width:min(42vw,260px)}
  #transportDock select{min-height:36px}
  #playBtns,#trainBtns{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
  #transportHideBtn{
    min-width:72px!important;padding:5px 10px!important;font-size:12px;font-weight:750;line-height:1;
    border:1px solid rgba(147,197,253,.62);border-radius:9px;background:#263750;color:#eff6ff;
  }
  #transportRevealDock{
    position:fixed;left:50%;bottom:max(8px, env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:4;display:none;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;box-sizing:border-box;
    width:max-content;max-width:calc(100vw - 12px);overflow:visible;padding:0 2px;
  }
  #transportRevealDock>*{flex:0 0 auto}
  #transportReveal, #captureRevealBtn{
    min-height:30px;padding:4px 10px;border-radius:999px;
    border:1px solid rgba(255,255,255,0.20);background:rgba(12,16,23,0.90);color:#ddd;
    box-shadow:0 3px 12px rgba(0,0,0,0.30);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #captureRevealBtn{background:rgba(128,24,36,0.92);color:#fff;font-weight:700}
  #captureNowBtn,#captureRevealBtn,.captureMarkerBtn{touch-action:manipulation}
  .captureMarkerGroup{display:inline-flex;align-items:center;gap:3px;flex:0 0 auto}
  .captureMarkerBtn{
    min-width:30px!important;width:30px;height:34px;min-height:34px!important;padding:0!important;
    border-radius:7px;font-weight:750;line-height:1;background:#2a303a;color:#f3f4f6;
  }
  #transportRevealDock .captureMarkerBtn{width:30px;height:30px;min-height:30px!important;border-radius:999px}
  body.transport-hidden #transportDock{display:none!important}
  body.transport-hidden #transportRevealDock{display:flex}
  body[data-workspace-mode="live"] #transportDock,body[data-workspace-mode="live"] #transportRevealDock{display:none!important}
  body[data-workspace-mode="train"] #transportHideBtn{display:none!important}
  body[data-workspace-mode="train"] #transportRevealDock{display:none!important}
  body[data-workspace-mode="train"].transport-hidden #transportDock{display:flex!important}
  body.ui-hidden #transportDock{background:rgba(12,16,23,0.94)}
  /* 横長画面では、操作部を一列にして高さを抑える。鍵盤の幅を優先する。 */
  @media (min-width:960px) and (orientation:landscape){
    #transportDock{
      width:min(1080px,calc(100vw - 32px));
      max-width:calc(100vw - 32px);
      flex-wrap:nowrap;
      justify-content:flex-start;
      gap:6px;
      padding:5px 8px;
    }
    #playBtns,#trainBtns{display:flex}
    #transportDock button{min-height:34px;padding:5px 9px}
    #transportDock select{min-height:34px}
    #seekWrap{display:flex;flex:1 1 auto;min-width:0;gap:8px}
    #seekWrap input[type=range]{width:auto;min-width:120px;flex:1 1 auto}
    #seekTime{flex:0 0 auto}
  }
  /*
    iPhone縦画面は操作を2段の固定グリッドにし、横スクロールを発生させない。
    1段目は再生、2段目はコード記録と役割を分け、幅が狭くても操作順を保つ。
  */
  @media (max-width:600px){
    #transportDock{
      left:6px;right:6px;width:auto;max-width:none;transform:none;
      display:flex;flex-wrap:wrap;justify-content:center;
      gap:5px;padding:5px 7px;overflow:visible;
    }
    #transportDock>*{min-width:0}
    #transportHideBtn,#playBtns,#trainBtns,#playbackRateWrap,#seekWrap{order:1}
    #transportDock::before{content:"";order:2;flex:0 0 100%;height:0}
    #captureListBtn,#captureNowBtn,#transportDock>.captureMarkerGroup{order:3}
    body[data-workspace-mode="train"] #transportDock{
      left:50%;right:auto;width:max-content;max-width:calc(100vw - 12px);transform:translateX(-50%);
      display:flex;flex-wrap:nowrap;justify-content:center;
    }
    body[data-workspace-mode="train"] #transportDock::before{display:none}
    #transportDock button{min-width:34px;padding:5px 6px}
    #playbackRateWrap,#seekWrap{font-size:0}
    #playbackRateWrap select{width:58px;min-width:0;padding-inline:4px;font-size:12px}
    #seekWrap{display:flex;min-width:0;flex:1 1 70px;gap:4px}
    #seekWrap input[type=range]{width:auto;min-width:0;flex:1 1 auto}
    #seekTime{flex:0 0 auto;font-size:10px}
    #captureListBtn,#captureNowBtn{padding-inline:4px;font-size:10px;white-space:nowrap}
    #transportHideBtn{
      min-width:58px!important;width:auto;padding-inline:5px!important;font-size:10px;background:#263750;
    }
    .captureMarkerGroup{gap:2px}
    #transportRevealDock{gap:5px}
    #transportRevealDock .captureMarkerBtn{width:28px;height:28px;min-height:28px!important}
  }
  /* 低い横画面は各要素を少し詰め、スクロールも折り返しもない一列にする。 */
  @media (min-width:601px) and (max-height:500px) and (orientation:landscape){
    #transportDock{
      left:6px;right:6px;width:auto;max-width:none;transform:none;
      flex-wrap:nowrap;justify-content:center;gap:3px;padding:4px 6px;overflow:visible;
    }
    #transportDock>*{min-width:0;flex:0 1 auto}
    #transportDock button{min-width:34px;padding:4px 5px}
    #playbackRateWrap,#seekWrap{font-size:0}
    #playbackRateWrap select,#seekWrap>*{font-size:11px}
    #playbackRateWrap select{width:58px;padding-inline:3px}
    #seekWrap{display:flex;flex:1 1 110px;min-width:96px;gap:3px}
    #seekWrap input[type=range]{width:auto;min-width:54px;flex:1 1 auto}
    #seekTime{flex:0 0 auto}
    #captureListBtn,#captureNowBtn{padding-inline:4px;font-size:11px;white-space:nowrap}
    .captureMarkerGroup{gap:2px}
    .captureMarkerBtn{width:34px!important;min-width:34px!important}
    #transportHideBtn{order:-100;min-width:58px!important;width:auto;padding-inline:5px!important;font-size:10px}
  }
  /* 横画面の練習操作は右側鍵盤の直下へまとめ、全幅の空ドックを作らない。 */
  @media (orientation:landscape) and (min-aspect-ratio:5/4){
    body[data-workspace-mode="train"] #transportDock{
      left:auto;right:max(16px,env(safe-area-inset-right));width:max-content;
      max-width:min(58vw,calc(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right)));
      transform:none;justify-content:center;padding-inline:7px
    }
    body[data-workspace-mode="train"] #trainBtns{max-width:100%;justify-content:center}
  }
  @media (pointer:coarse){
    #transportDock button,#transportDock select{min-height:44px}
    .captureMarkerBtn{width:40px!important;min-width:40px!important;height:44px;min-height:44px!important}
  }
  @media (pointer:coarse) and (max-width:600px){
    #transportDock .captureMarkerBtn{width:34px!important;min-width:34px!important;height:44px;min-height:44px!important}
  }
  @media (pointer:coarse) and (min-width:601px) and (max-height:500px) and (orientation:landscape){
    #transportDock .captureMarkerBtn{width:34px!important;min-width:34px!important;height:44px;min-height:44px!important}
  }
  @media (max-width:350px){
    #seekTime{display:none}
  }

  /* 手動コード記録 */
  #captureToast{
    position:fixed;left:50%;bottom:calc(max(8px, env(safe-area-inset-bottom)) + 120px);transform:translateX(-50%);
    z-index:7;display:none;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.84);color:#fff;
    max-width:calc(100vw - 24px);box-sizing:border-box;pointer-events:none;white-space:normal;text-align:center;
  }
  #capturePanel{
    position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;
    padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    background:rgba(0,0,0,.58);box-sizing:border-box;
  }
  #capturePanel.open{display:flex}
  #captureDialog{
    width:min(760px,100%);max-height:100%;overflow:auto;box-sizing:border-box;
    border:1px solid rgba(255,255,255,.22);border-radius:14px;background:#151a22;padding:14px;
    box-shadow:0 8px 32px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text;
  }
  #captureDialog h2{font-size:18px;margin:0 0 10px}
  #captureToolbar,#captureExportSettings{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  #captureRecoveryStatus{margin:-2px 0 10px;padding:7px 9px;border-radius:8px;background:rgba(59,130,246,.12);color:#bfdbfe;font-size:13px}
  #captureRecoveryStatus:empty{display:none}
  #captureRecoveryStatus.warning{background:rgba(245,158,11,.15);color:#fde68a}
  #captureToolbar button,#captureExportSettings button,#captureExportSettings select{min-height:36px}
  #captureFormatOptions{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 10px}
  #captureFormatOptions label{white-space:nowrap}
  #captureSummary{margin:8px 0 10px;color:#cbd5e1;font-size:14px}
  #capturePreview{width:100%;min-height:260px;box-sizing:border-box;padding:10px;background:#0b0f15;color:#e6edf7;border:1px solid #465064;border-radius:8px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-user-select:text;user-select:text}
  @media(max-width:620px){
    #captureDialog{padding:10px}
  }
</style>

<header id="appBar">
  <strong id="appBrand">Tonality Visualizer</strong>
  <nav id="purposeNav" role="tablist" aria-label="利用目的">
    <button id="modeLive" type="button" data-workspace-mode="live" role="tab" aria-selected="false">演奏を見る</button>
    <button id="modeAnalyze" type="button" data-workspace-mode="play" role="tab" aria-selected="true">曲を分析</button>
    <button id="modePractice" type="button" data-workspace-mode="train" role="tab" aria-selected="false">音群練習</button>
  </nav>
  <button id="openMidiQuick" type="button">MIDIを開く</button>
  <button id="candidateToggle" type="button" data-display-level="summary" aria-label="コード表示">コード表示</button>
  <button id="researchToggle" type="button" aria-pressed="false">詳細表示</button>
  <span id="analysisSourceStatus" role="status">解析: 入力待ち</span>
  <button id="diskLock" type="button" aria-pressed="false">回転モード</button>
  <button id="uiToggle" type="button" aria-pressed="false" aria-expanded="false" aria-controls="ui">設定</button>
</header>
<button id="landscapeNavToggle" type="button" aria-controls="appBar" aria-expanded="false"
  aria-label="操作を表示" title="操作を表示" hidden>☰</button>
<div id="ui">
  <div id="settingsHeader">
    <!-- 言語名は、現在のUI言語に依存せず判別できるendonymで表示する。 -->
    <label id="langWrap">
      <span aria-hidden="true">🌐</span>
      <span id="languageLabel" data-lbl="language">言語</span>
      <select id="lang" aria-labelledby="languageLabel">
        <option value="en">English</option>
        <option value="pt-BR">Português (Brasil)</option>
        <option value="es-MX">Español (México)</option>
        <option value="ja" selected>日本語</option>
        <option value="ko">한국어</option>
        <option value="zh">简体中文</option>
      </select>
    </label>
    <button id="settingsCloseBtn" type="button">× 設定を閉じる</button>
  </div>

  <button id="resetSettings" type="button">初期設定に戻す</button>
  <button id="appBarVisibilityBtn" type="button" aria-pressed="false">上部タブを隠す</button>

  <label id="presetWrap" data-lbl="presetSlot">
    <select id="presetSlot"></select>
  </label>
  <button id="savePreset" type="button">プリセット保存</button>
  <button id="loadPreset" type="button">プリセット読込</button>

  <!-- anchor: 水面固定 or ディスク固定 -->

<script>
/* ===== UI scaling ===== */
// iPhoneでUIが縮みすぎないようにスケール調整する
const isIPhone = /iPhone/i.test(navigator.userAgent);
if (isIPhone) {
  document.documentElement.style.setProperty('--ui-scale', '0.75');
  document.body.classList.add('ios');
}

/* ===== Canvas ===== */
// メインキャンバスの初期化とリサイズ処理
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const COMPACT_LANDSCAPE_QUERY = '(max-height:500px) and (orientation:landscape)';
function isCompactLandscapeViewport(){ return matchMedia(COMPACT_LANDSCAPE_QUERY).matches; }
let topControlsInsetCss = 0;
function updateCanvasChromeInsets(){
  const canvasRect = cv.getBoundingClientRect();
  let controlsBottom = canvasRect.top;
  const landscapeNavIsOverlay = isCompactLandscapeViewport();
  const appBarIsUserHidden = !!document.body?.classList?.contains?.('app-bar-hidden');
  for(const id of ['appBar']){
    if((landscapeNavIsOverlay || appBarIsUserHidden) && id === 'appBar') continue;
    const element = document.getElementById(id);
    if(!element) continue;
    const rect = element.getBoundingClientRect();
    if(rect.width > 0 && rect.height > 0) controlsBottom = Math.max(controlsBottom, rect.bottom);
  }
  // 縦画面で上部タブを隠したときも、Dynamic Island／ノッチと
  // 44pxの復元ボタンの直下までは円盤・外周音名を入れない。
  if(appBarIsUserHidden){
    const reveal = document.getElementById('landscapeNavToggle');
    const rect = reveal?.getBoundingClientRect?.();
    if(rect && rect.width > 0 && rect.height > 0) controlsBottom = Math.max(controlsBottom, rect.bottom);
  }
  // 上部UIの実測下端から間隔を空け、円盤の描画・タッチ領域を始める。
  // 縦向きiPhoneでは外周音名もタブへ入らないよう、その文字高まで予約する。
  const compactPortrait = matchMedia('(max-width:760px) and (orientation:portrait)').matches;
  const chromeGapCss = compactPortrait ? (appBarIsUserHidden ? 8 : 32) : 8;
  topControlsInsetCss = Math.max(0, Math.ceil(controlsBottom - canvasRect.top + chromeGapCss));
}
// ウィンドウの大きさに応じてキャンバスをリサイズし、Retina解像度にも対応
function resize(){
  cv.width = innerWidth*devicePixelRatio;
  cv.height = innerHeight*devicePixelRatio;
  updateCanvasChromeInsets();
}
addEventListener('resize', resize); resize();
if(typeof ResizeObserver === 'function'){
  const chromeResizeObserver = new ResizeObserver(updateCanvasChromeInsets);
  ['appBar'].forEach(id=>{
    const element = document.getElementById(id);
    if(element) chromeResizeObserver.observe(element);
  });
}

function buildSettingsSections(){
  if(!uiPanel || uiPanel.querySelector(".settings-section")) return;
  for(const [index, section] of SETTINGS_SECTIONS.entries()){
    const details = document.createElement("details");
    details.className = "settings-section";
    details.dataset.sectionKey = section.key;
    details.open = index === 0;
    const summary = document.createElement("summary");
    summary.textContent = section.fallback;
    const content = document.createElement("div");
    content.className = "settings-section-content";
    details.append(summary, content);
    for(const id of section.ids){
      const element = document.getElementById(id);
      if(element) content.appendChild(element);
    }
    uiPanel.appendChild(details);
  }

function reserveValueWidths(){
  const reserve = (el, samples)=>{
    if(!el || !samples || !samples.length) return;
    const probe = document.createElement('span');
    probe.style.visibility = 'hidden';
    probe.style.position = 'absolute';
    probe.style.whiteSpace = 'pre';
    probe.style.font = 'inherit';
    probe.style.fontVariantNumeric = 'tabular-nums';
    uiPanel.appendChild(probe);
    let maxWidth = 0;
    for(const text of samples){
      probe.textContent = text;
      const w = probe.getBoundingClientRect().width;
      if(w > maxWidth) maxWidth = w;
    }
    uiPanel.removeChild(probe);
    el.style.display = 'inline-block';
    el.style.minWidth = `${Math.ceil(maxWidth)}px`;

const SETTINGS_KEY = 'ppm:v6';
const PRESET_SLOT_COUNT = 3;
const presetStorageKey = slot => `${SETTINGS_KEY}:preset${slot}`;
const clampPresetSlot = value => {
  const parsed = parseInt(value,10);
  if(Number.isNaN(parsed)) return 1;
  return Math.max(1, Math.min(PRESET_SLOT_COUNT, parsed));
};
// 初回ロード時のデフォルト設定をキャッシュ
let DEFAULT_SETTINGS = null;
let settingsWriteSuspended = 0;
let preferredMidiDeviceId = "";
function withSettingsWriteSuspended(action){
  settingsWriteSuspended++;
  try{ return action(); }
  finally{ settingsWriteSuspended = Math.max(0, settingsWriteSuspended - 1); }
}
const WORKSPACE_KEY = "tonalityWorkspaceV1";
let workspaceMode = "play";
// 0: 非表示、1: コード要約、2: コード要約＋候補。
let chordDisplayLevel = 1;
// 旧workspaceスナップショットとの互換用。新しい描画判断はchordDisplayLevelを正本とする。
let analysisCandidatesVisible = false;
let researchDetailsVisible = false;
let analysisHasLive = false;
let analysisHasFile = false;
function setChordDisplayLevel(level){
  const parsed = Number(level);
  chordDisplayLevel = Number.isFinite(parsed) ? Math.max(0, Math.min(2, Math.round(parsed))) : 1;
  analysisCandidatesVisible = chordDisplayLevel === 2;
}
function saveWorkspaceState(){
  try{
    localStorage.setItem(WORKSPACE_KEY, JSON.stringify({
      schemaVersion:1, workspaceMode, chordDisplayLevel, analysisCandidatesVisible, researchDetailsVisible
    }));
  }catch(e){}
}
function updateOverlayToggleUI(){
  if(candidateToggle){
    const displayLabels = [t("chordHidden"), t("chordSummary"), t("chordCandidates")];
    const displayNames = ["hidden", "summary", "candidates"];
    const label = displayLabels[chordDisplayLevel] || displayLabels[1];
    candidateToggle.textContent = label;
    candidateToggle.dataset.displayLevel = displayNames[chordDisplayLevel] || displayNames[1];
    candidateToggle.setAttribute("aria-label", label);
    candidateToggle.removeAttribute("aria-pressed");
  }
  if(researchToggle){
    researchToggle.textContent = t("researchDetails");
    researchToggle.setAttribute("aria-pressed", String(researchDetailsVisible));
  }
}

  const legacy = typeof keyboardMovableToggle !== 'undefined' ? keyboardMovableToggle : null;

// 保存された設定をUIに反映する
function applySettings(settings, {force = false} = {}){
  const s = (settings && typeof settings === 'object') ? settings : {};
  const has = key => force ? (key in s) : (s[key] != null);

  // 言語関連の復元
  if(has('lang')){
    lang = SUPPORTED_LANGS.includes(s.lang) ? s.lang : 'en';
  }
  // UIスケール関連の復元
  if(has('uiScale')){
    const parsed = parseFloat(s.uiScale);
    if(!Number.isNaN(parsed)) uiScale = isIPhone ? 0.75 : parsed;
  }
  // ここから下は順番依存のため見通しを良くするため小分けにコメントを挿入
  // アンカーやMIDI関連の復元
  if(has('anchor') && s.anchor){
    anchorSel.value = s.anchor;
  }
  if(has('circleOrder')){
    circleOrder = normalizeCircleOrder(s.circleOrder);
    if(circleOrderSel) circleOrderSel.value = circleOrder;
  }
  if(has('midiAll')){
    midiAll.checked = !!s.midiAll;
  }
  if(has('liveMon')){
    liveMon.checked = !!s.liveMon;
  }
  if(has('midiDeviceId')){
    preferredMidiDeviceId = typeof s.midiDeviceId === "string" ? s.midiDeviceId : "";
  }
  // 視覚設定の値を順番に反映
  if(has('uiop')){
    uiopSlider.value = s.uiop;
    applyUIOpacity();
  }
  if(has('mass')){
    massSlider.value = s.mass;
    updateMass();
  }
  if(has('lineA')){
    lineASlider.value = s.lineA;
    lineASlider.oninput();
  }
  if(has('straightLineA')){
    straightLineASlider.value = s.straightLineA;
    straightLineASlider.oninput();
  }
  if(has('waterA')){
    waterASlider.value = s.waterA;
    waterASlider.oninput();
  }
  if(has('k2WaterA')){
    k2WaterASlider.value = s.k2WaterA;
    k2WaterASlider.oninput();
  }
  if(has('noteGuideA')){
    noteGuideASlider.value = s.noteGuideA;
    noteGuideASlider.oninput();
  }
  if(has('arcGuideA')){
    arcGuideASlider.value = s.arcGuideA;
    arcGuideASlider.oninput();
  }
  if(has('noteGuideLabelA')){
    noteGuideLabelASlider.value = s.noteGuideLabelA;
    noteGuideLabelASlider.oninput();
  }
  if(has('movNumA')){
    movNumASlider.value = s.movNumA;
    movNumASlider.oninput();
  }
  if(has('movNumSize')){
    movNumSizeSlider.value = s.movNumSize;
    movNumSizeSlider.oninput();
  }
  if(has('noteDotSize')){
    noteDotSizeSlider.value = s.noteDotSize;
    noteDotSizeSlider.oninput();
  }
  if(has('labelSize')){
    labelSizeSlider.value = s.labelSize;
    labelSizeSlider.oninput();
  }
  if(has('labelBG')){
    labelBGSlider.value = s.labelBG;
    labelBGSlider.oninput();
  }
  if(has('labelAlpha')){
    labelAlphaSlider.value = s.labelAlpha;
    labelAlphaSlider.oninput();
  }
  if(has('outerHighlightAlpha')){
    outerHighlightAlphaSlider.value = s.outerHighlightAlpha;
    outerHighlightAlphaSlider.oninput();
  }
  if(has('compositionInfoA')){
    compositionInfoASlider.value = s.compositionInfoA;
    compositionInfoASlider.oninput();
  }
  if(has('chordCandidateCount')){
    chordCandidateCountInput.value = s.chordCandidateCount;
    chordCandidateCountInput.oninput();
  }
  const keyboardPreset = (s.keyboard && typeof s.keyboard === 'object') ? s.keyboard : null;
  const rangeSelect = typeof keyboardRangeSelect !== 'undefined' ? keyboardRangeSelect : null;
  const movableModeSelect = typeof keyboardMovableModeSelect !== 'undefined' ? keyboardMovableModeSelect : null;
  const relationModeSelect = typeof keyboardRelationModeSelect !== 'undefined' ? keyboardRelationModeSelect : null;
  const legacyMovableToggle = typeof keyboardMovableToggle !== 'undefined' ? keyboardMovableToggle : null;
  const legacyDistanceToggle = typeof keyboardDistanceToggle !== 'undefined' ? keyboardDistanceToggle : null;
  const normalizeRange = value => (value === '2oct' || value === 2 || value === '2') ? '2oct' : '1oct';
  const normalizeMovableMode = value => ['card','colorText','off'].includes(value) ? value : 'card';
  const normalizeRelationMode = value => ['angleCard','distance','off'].includes(value) ? value : 'angleCard';

  if(keyboardPreset){
    if('enabled' in keyboardPreset) keyboardToggle.checked = !!keyboardPreset.enabled;
    if('sizePct' in keyboardPreset){
      const value = Math.max(70, Math.min(170, parseInt(keyboardPreset.sizePct, 10) || 100));
      keyboardSizeSlider.value = String(value);
    }
  }
  if(has('keyboardEnabled')){
    keyboardToggle.checked = !!s.keyboardEnabled;
  }
  if(has('keyboardSize')){
    const value = Math.max(70, Math.min(170, parseInt(s.keyboardSize, 10) || 100));
    keyboardSizeSlider.value = String(value);
  }

  // Canonical enum/range values always outrank legacy booleans, regardless
  // of whether they came from the nested keyboard object or old flat keys.
  const nestedRangeKey = keyboardPreset && ('range' in keyboardPreset || 'rangeOctaves' in keyboardPreset);
  const flatRangeKey = has('keyboardRange');
  if(rangeSelect && (flatRangeKey || nestedRangeKey)){
    const raw = flatRangeKey
      ? s.keyboardRange
      : ('range' in keyboardPreset ? keyboardPreset.range : keyboardPreset.rangeOctaves);
    rangeSelect.value = normalizeRange(raw);
  }

  const nestedMovableEnum = keyboardPreset && 'movableMode' in keyboardPreset;
  const flatMovableEnum = has('keyboardMovableMode');
  if(movableModeSelect && (flatMovableEnum || nestedMovableEnum)){
    movableModeSelect.value = normalizeMovableMode(flatMovableEnum ? s.keyboardMovableMode : keyboardPreset.movableMode);
  }else if(movableModeSelect){
    const nestedLegacy = keyboardPreset && 'movableDo' in keyboardPreset;
    const flatLegacy = has('keyboardMovableDo');
    if(flatLegacy || nestedLegacy){
      const visible = flatLegacy ? !!s.keyboardMovableDo : !!keyboardPreset.movableDo;
      movableModeSelect.value = visible ? 'card' : 'off';
    }
  }else if(legacyMovableToggle){
    if(keyboardPreset && 'movableDo' in keyboardPreset) legacyMovableToggle.checked = !!keyboardPreset.movableDo;
    if(has('keyboardMovableDo')) legacyMovableToggle.checked = !!s.keyboardMovableDo;
  }

  const nestedRelationEnum = keyboardPreset && 'relationMode' in keyboardPreset;
  const flatRelationEnum = has('keyboardRelationMode');
  if(relationModeSelect && (flatRelationEnum || nestedRelationEnum)){
    relationModeSelect.value = normalizeRelationMode(flatRelationEnum ? s.keyboardRelationMode : keyboardPreset.relationMode);
  }else if(relationModeSelect){
    const hasLegacyDistance = !!(keyboardPreset && 'distance' in keyboardPreset) || has('keyboardDistance');
    if(hasLegacyDistance) relationModeSelect.value = 'angleCard';
  }else if(legacyDistanceToggle){
    if(keyboardPreset && 'distance' in keyboardPreset) legacyDistanceToggle.checked = !!keyboardPreset.distance;
    if(has('keyboardDistance')) legacyDistanceToggle.checked = !!s.keyboardDistance;
  }

  keyboardEnabled = keyboardToggle.checked;
  if(rangeSelect && typeof keyboardRangeOctaves !== 'undefined') keyboardRangeOctaves = rangeSelect.value === '2oct' ? 2 : 1;
  if(movableModeSelect && typeof keyboardMovableMode !== 'undefined') keyboardMovableMode = normalizeMovableMode(movableModeSelect.value);
  if(relationModeSelect && typeof keyboardRelationMode !== 'undefined') keyboardRelationMode = normalizeRelationMode(relationModeSelect.value);
  if(typeof keyboardShowMovable !== 'undefined'){
    keyboardShowMovable = movableModeSelect ? movableModeSelect.value !== 'off' : !!(legacyMovableToggle && legacyMovableToggle.checked);
  }
  if(typeof keyboardShowDistance !== 'undefined'){
    keyboardShowDistance = relationModeSelect ? relationModeSelect.value === 'distance' : !!(legacyDistanceToggle && legacyDistanceToggle.checked);
  }
  keyboardScalePct = Math.max(70, Math.min(170, parseInt(keyboardSizeSlider.value, 10) || 100));
  keyboardSizeVal.textContent = `${keyboardScalePct}%`;
  if(has('exclude')){
    excludeSel.value = s.exclude;
    excludeMode = excludeSel.value;
  }
  if(has('lowCut')){
    // 入力値は整数として扱い、NaNなら0に戻す
    const value = parseInt(s.lowCut,10);
    applyLowCut(Number.isNaN(value) ? 0 : value, false);
  }
  if(has('highCut')){
    // 高域の制限も同様に安全な範囲へクランプ
    const value = parseInt(s.highCut,10);
    applyHighCut(Number.isNaN(value) ? 0 : value, false);
  }
  if(has('omegaMaxExp')){
    omegaMaxSlider.value = s.omegaMaxExp;
    applyOmegaMaxFromSlider();
  }
  if(has('midiTranspose')){
    const value = parseInt(s.midiTranspose,10);
    const clamped = Math.max(-6, Math.min(6, Number.isNaN(value) ? 0 : value));
    midiTranspose = clamped;
    transposeSlider.value = String(clamped);
    applyTransposeSetting({shouldSave:false, preservePlayback:false});
  }
  if(has('playbackRate')){
    applyPlaybackRateSetting(s.playbackRate, {shouldSave:false});
  }
  if(has('dampPct')){
    dampSlider.value = s.dampPct;
  }else if(!force && s.dampExp!=null){
    const exp = parseFloat(s.dampExp);
    if(!Number.isNaN(exp)){
      const q = Math.min(99, Math.max(0.001, Math.pow(10, exp)));
      const p = 100 - q;
      dampSlider.value = Math.min(99, Math.max(0, p));
    }
  }
  if(has('snapZeroAlpha')){
    snapAlphaCheckbox.checked = !!s.snapZeroAlpha;
  }
  if(has('fileOp')){
    fileOp.value = s.fileOp;
  }
  if(has('diskLocked')){
    diskLocked = !!s.diskLocked;
  }
  if(has('uiHidden')){
    uiVisible = !s.uiHidden;
    updateUIVisibility();
  }
  if(has('transportHidden')){
    transportVisible = !s.transportHidden;
    updateTransportVisibility();
  }
  if(has('appBarHidden')){
    appBarHidden = !!s.appBarHidden;
    updateLandscapeNavVisibility();
  }
}

function loadSettings(){

    stored = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') || {};

function selectedPresetSlot(){

function collectPresetSettingsFromUI(){
  const settings = {...collectSettingsFromUI()};
  // 言語は利用者自身のアプリ設定であり、見た目のプリセットには含めない。
  delete settings.lang;
  return settings;
}

function savePreset(slot){
  const target = clampPresetSlot(slot);
  try{
    localStorage.setItem(presetStorageKey(target), JSON.stringify(collectPresetSettingsFromUI()));
    info.textContent = `${t('presetSaved')} #${target}`;
  }catch{
    info.textContent = t('presetSaveFailed');
  }
}

function loadPreset(slot){
  const target = clampPresetSlot(slot);
  let storedPreset = null;
  try{
    storedPreset = JSON.parse(localStorage.getItem(presetStorageKey(target)) || 'null');
  }catch{}
  if(!storedPreset){
    info.textContent = t('presetEmpty');
    return;
  }
  // 旧プリセットに言語が残っていても、現在の利用者言語を上書きしない。
  const presetSettings = {...storedPreset};
  delete presetSettings.lang;
  withSettingsWriteSuspended(()=>{
    applySettings(presetSettings, {force:true});
    finalizeAppliedSettings({shouldConnectMIDI:true});
  });
  saveSettings();
  info.textContent = `${t('presetLoaded')} #${target}`;
}

/* ===== Helpers ===== */
function midiToHz(m){ return 440*Math.pow(2,(m-69)/12); }
function hzToMidi(f){ return 12*Math.log2(f/440)+69; }
function transportReservedBottom(){
  const target = (workspaceMode === 'train' || transportVisible) ? transportDock : transportRevealDock;
  if(!target) return 0;
  const rect = target.getBoundingClientRect();
  if(!Number.isFinite(rect.height) || rect.height <= 0) return 0;
  const canvasRect = cv.getBoundingClientRect();
  if(!Number.isFinite(canvasRect.bottom) || !Number.isFinite(rect.top)) return 0;
  // Dockの高さだけではiPhoneのsafe-area下余白を予約できない。
  // Canvas下端からDock上端までを実測する。鍵盤側の既存paddingが
  // ハイライトの光彩を含む一定の隙間になるため、追加の空白は設けない。
  const occupiedCss = Math.max(0, canvasRect.bottom - rect.top);
  return Math.ceil(occupiedCss * devicePixelRatio);
}
function keyboardMetrics(){
  const transportBottom = transportReservedBottom();
  if(!keyboardEnabled) return {active:false, mode:'none', height:0, padding:0, reservedBottom:transportBottom, reservedRight:0, panelWidth:0, panelGap:0, transportBottom};
  const scale = Math.max(0.7, Math.min(1.7, keyboardScalePct / 100));
  const padding = 16 * devicePixelRatio;
  const baseHeight = Math.min(140 * devicePixelRatio, cv.height * 0.25);
  const height = Math.min(baseHeight * scale, cv.height * 0.42);
  const landscape = cv.width > cv.height * 1.25;
  if(landscape){
    const panelGap = 12 * devicePixelRatio;
    // 鍵盤を大きくした分だけ右側の領域を広げ、円盤領域を縮小する。
    const targetDiskRatio = Math.max(0.62, 1.02 - Math.max(0, scale - 1) * 0.42);
    const targetDiskAreaWidth = cv.height * targetDiskRatio;
    const panelFromTarget = cv.width - targetDiskAreaWidth - panelGap;
    const desiredPanelWidth = Math.max(cv.width * 0.30 * scale, panelFromTarget);
    const minDiskRatio = Math.max(0.56, 0.82 - Math.max(0, scale - 1) * 0.28);
    const minDiskAreaWidth = cv.height * minDiskRatio;
    const maxPanelWidth = Math.max(0, cv.width - minDiskAreaWidth - panelGap);
    const panelWidth = Math.min(desiredPanelWidth, maxPanelWidth);
    if(panelWidth >= 180 * devicePixelRatio){
      // In compact landscape training the three practice actions live only
      // beneath the right-side keyboard.  Keep their height for the keyboard
      // Y position, but do not subtract that right-only dock from the disk's
      // entire bottom edge.
      const trainerDockIsSideOnly = workspaceMode === 'train';
      return {
        active:true,
        mode:'side',
        height,
        padding,
        reservedBottom:trainerDockIsSideOnly ? 0 : transportBottom,
        reservedRight:panelWidth + panelGap,
        panelWidth,
        panelGap,
        transportBottom,
        trainerDockIsSideOnly
      };
    }
  }
  return {active:true, mode:'bottom', height, padding, reservedBottom:height + padding * 2 + transportBottom, reservedRight:0, panelWidth:0, panelGap:0, transportBottom};
}
// 上部ナビ、鍵盤、下部操作を除いたCanvas上の安全な描画領域。
// コード欄と詳細欄は必ずこの矩形内へ収める。
function canvasContentRect(marginCss = 12){
  const keyboard = keyboardMetrics();
  const margin = Math.max(0, marginCss * devicePixelRatio);
  const left = margin;
  const top = Math.max(margin, topControlsInsetCss * devicePixelRatio + 8 * devicePixelRatio);
  const right = Math.max(left + 1, cv.width - keyboard.reservedRight - margin);
  const bottom = Math.max(top + 1, cv.height - keyboard.reservedBottom - margin);
  return {
    left, top, right, bottom,
    width: Math.max(1, right - left),
    height: Math.max(1, bottom - top),
    keyboard
  };
}
// 低い横画面のナビ復元ボタンはCanvas上に浮くため、右上の研究欄だけ
// その実測矩形より下へ逃がす。円盤全体の上余白には含めない。
function avoidLandscapeNavToggle(rect){
  if(!rect || !isCompactLandscapeViewport() || !landscapeNavToggle || landscapeNavToggle.hidden) return rect;
  const toggleRect = landscapeNavToggle.getBoundingClientRect?.();
  const canvasRect = cv.getBoundingClientRect?.();
  if(!toggleRect || !canvasRect || !(canvasRect.width > 0) || !(canvasRect.height > 0)) return rect;
  const scaleX = cv.width / canvasRect.width;
  const scaleY = cv.height / canvasRect.height;
  const toggleLeft = (toggleRect.left - canvasRect.left) * scaleX;
  const toggleRight = (toggleRect.right - canvasRect.left) * scaleX;
  if(!Number.isFinite(toggleLeft) || !Number.isFinite(toggleRight)) return rect;
  if(toggleRight <= rect.left || toggleLeft >= rect.right) return rect;
  // Keep the full vertical room above the keyboard whenever the detail pane
  // can fit to the left of the reveal button.  Moving it down first makes the
  // 11 research rows compete with the keyboard on short iPhone landscapes.
  const horizontalRight = Math.min(rect.right, toggleLeft - 8 * scaleX);
  const minHorizontalWidth = Math.min(rect.width, 108 * scaleX);
  if(horizontalRight - rect.left >= minHorizontalWidth){
    return {
      ...rect,
      right:horizontalRight,
      width:Math.max(1, horizontalRight - rect.left),
      navToggleAvoided:true,
      navToggleAvoidance:'horizontal'
    };
  }
  const toggleBottom = (toggleRect.bottom - canvasRect.top) * scaleY;
  if(!Number.isFinite(toggleBottom)) return rect;
  const safeTop = toggleBottom + 8 * scaleY;
  const top = Math.min(rect.bottom - 1, Math.max(rect.top, safeTop));
  return {
    ...rect,
    top,
    height:Math.max(1, rect.bottom - top),
    navToggleAvoided:top > rect.top,
    navToggleAvoidance:top > rect.top ? 'vertical' : null
  };
}

// 横画面の右側鍵盤では、鍵盤より上の空間を解析情報専用領域として使う。
// コードと研究詳細を同時表示する場合も、円盤側へ戻さず左右へ分割する。
function analysisOverlayContentRect(kind, marginCss = 12){
  const keyboard = keyboardMetrics();
  if(!(keyboard.active && keyboard.mode === 'side')) return canvasContentRect(marginCss);

  const margin = Math.max(0, marginCss * devicePixelRatio);
  const panelInset = Math.max(margin, keyboard.padding);
  const left = Math.max(margin, cv.width - keyboard.panelWidth + panelInset);
  const right = Math.max(left + 1, cv.width - panelInset);
  const top = Math.max(margin, topControlsInsetCss * devicePixelRatio + 8 * devicePixelRatio);
  const keyboardTop = cv.height - keyboard.transportBottom - keyboard.height - keyboard.padding;
  const bottom = Math.max(top + 1, keyboardTop - margin);
  const whole = {
    left, top, right, bottom,
    width: Math.max(1, right - left),
    height: Math.max(1, bottom - top),
    keyboard,
    placement:'side-keyboard-above'
  };

  const bothVisible = chordDisplayLevel > 0 && researchDetailsVisible;
  if(!bothVisible) return kind === 'research' ? avoidLandscapeNavToggle(whole) : whole;

  const gap = Math.min(10 * devicePixelRatio, whole.width * 0.08);
  const usableWidth = Math.max(2, whole.width - gap);
  const chordWidth = usableWidth * 0.56;
  const splitLeft = whole.left + chordWidth;
  if(kind === 'research'){
    const paneLeft = splitLeft + gap;
    return avoidLandscapeNavToggle({
      ...whole,
      left:paneLeft,
      width:Math.max(1, whole.right - paneLeft)
    });
  }
  return {
    ...whole,
    right:splitLeft,
    width:Math.max(1, splitLeft - whole.left)
  };
}
// 縦画面など右側鍵盤を使わない場合は、円盤に割り当てられた矩形を
// 四分割して解析情報を四隅へ置く。各欄を別slotへ閉じ込めることで、
// コード名・Degree・候補・研究詳細が互いに押し出し合わないようにする。
function analysisCornerContentRect(kind, marginCss = 12){
  const safe = canvasContentRect(marginCss);
  if(safe.keyboard.active && safe.keyboard.mode === 'side'){
    return analysisOverlayContentRect(kind === 'research' ? 'research' : 'chord', marginCss);
  }
  const {cx, cy} = canvasCenter();
  const {rMax} = ringParams();
  const whole = {
    left:Math.max(safe.left, cx - rMax),
    top:Math.max(safe.top, cy - rMax),
    right:Math.min(safe.right, cx + rMax),
    bottom:Math.min(safe.bottom, cy + rMax),
    keyboard:safe.keyboard
  };
  whole.width = Math.max(1, whole.right - whole.left);
  whole.height = Math.max(1, whole.bottom - whole.top);
  const gap = Math.min(10 * devicePixelRatio, whole.width * 0.04, whole.height * 0.04);
  const splitX = whole.left + whole.width / 2;
  const cornerTextSize = Math.min(
    18 * devicePixelRatio,
    Math.max(11 * devicePixelRatio, labelFontPx * devicePixelRatio * 0.9)
  );
  // The upper code rows belong in the empty strip just above the disk, not on
  // its outer ring. Raise both top corners by exactly one rendered row while
  // keeping the measured app-bar safety boundary as a hard ceiling.
  const cornerRowHeight = cornerTextSize + 4 * devicePixelRatio;
  const topSafety = Math.max(marginCss * devicePixelRatio, topControlsInsetCss * devicePixelRatio);
  const raisedTop = Math.max(topSafety, whole.top - cornerRowHeight);
  // Use a little of the symmetric side whitespace as well. Only the two top
  // summaries expand; candidate/research corners retain their current boxes.
  const topOutset = Math.max(0, Math.min(
    8 * devicePixelRatio,
    whole.left - safe.left,
    safe.right - whole.right
  ));
  const desiredTopBand = Math.max(64 * devicePixelRatio, cornerTextSize * 2 + 24 * devicePixelRatio);
  const topBandHeight = Math.min(whole.height * 0.44, desiredTopBand);
  const splitY = Math.min(whole.bottom - gap - 1, whole.top + topBandHeight);
  const isRight = kind === 'degree' || kind === 'research';
  const isBottom = kind === 'candidates' || kind === 'research';
  const left = isRight
    ? splitX + gap / 2
    : (isBottom ? whole.left : whole.left - topOutset);
  const right = isRight
    ? (isBottom ? whole.right : whole.right + topOutset)
    : splitX - gap / 2;
  const top = isBottom ? splitY + gap / 2 : raisedTop;
  const bottom = isBottom ? whole.bottom : splitY - gap / 2;
  return {
    left,
    top,
    right:Math.max(left + 1, right),
    bottom:Math.max(top + 1, bottom),
    width:Math.max(1, right - left),
    height:Math.max(1, bottom - top),
    keyboard:safe.keyboard,
    placement:`disk-corner-${kind}`
  };
}
function canvasCenter(){
  const keyboard = keyboardMetrics();
  const reservedTop = Math.max(0, topControlsInsetCss * devicePixelRatio);
  const availableWidth = Math.max(1, cv.width - keyboard.reservedRight);
  const availableHeight = Math.max(1, cv.height - reservedTop - keyboard.reservedBottom);
  return {
    cx: availableWidth / 2,
    cy: reservedTop + availableHeight / 2,
    reservedTop,
    reserved: keyboard.reservedBottom,
    reservedRight: keyboard.reservedRight
  };
}
function canvasCenterCss(){
  const rect = cv.getBoundingClientRect();

  const reservedTopCss = Math.max(0, topControlsInsetCss);
  const reservedBottomCss = keyboard.reservedBottom / devicePixelRatio;
  const reservedRightCss = keyboard.reservedRight / devicePixelRatio;
  const availableWidthCss = Math.max(1, rect.width - reservedRightCss);
  const availableHeightCss = Math.max(1, rect.height - reservedTopCss - reservedBottomCss);

    cx: rect.left + availableWidthCss / 2,
    cy: rect.top + reservedTopCss + availableHeightCss / 2
  };
}
function ringParams(){
  const keyboard = keyboardMetrics();

  const halfWidth = availableWidth / 2;
  const half = Math.max(1, Math.min(halfWidth, halfHeight));
  const safeHalf = Math.max(1, half - 4);
  let rMax = half - MARGIN;
  if(!Number.isFinite(rMax)) rMax = safeHalf;
  if(rMax < 1) rMax = safeHalf;

  const octaves = activeOctaveCount();
  const minRadius = (highCutOct > 0) ? rMax * 0.1 : 0;
  const span = Math.max(0, rMax - minRadius);
  const step = octaves ? (span / octaves) : 0;

}
function baseAngleFromFifthIndex(i){ return ANG0 + 2*Math.PI*(i%12)/12; }
function visualAngleFromFifthIndex(index, rotation = 0){

}

}
// 物理・理論は配置設定から独立させ、従来の論理角を正本にする。
function angleForMidiAbs(m){ return logicalAngleForMidi(m, diskAngle); }
// 画面上の位置だけを必要に応じて鏡映する。

}
function radiusFromFreq(f, rMax, step, minRadius = 0){
  const octaves = activeOctaveCount();
  const oc = Math.log2(f / minDisplayFreq());
  const ocClamped = Math.max(0, Math.min(octaves, oc));
  const r = rMax - step*ocClamped;
  return Math.max(minRadius, Math.min(rMax, r));
}
function polarToXY(cx,cy,r,th){ return { x: cx + r*Math.cos(th), y: cy - r*Math.sin(th) }; }
function shortestDelta(a,b){ let d=b-a; while(d> Math.PI) d-=2*Math.PI; while(d<=-Math.PI) d+=2*Math.PI; return d; }
function mergeNoteMaps(...maps){
  const merged = new Map();
  for(const m of maps){
    for(const [note, vel] of m){
      const prev = merged.get(note);
      if(prev == null || vel > prev) merged.set(note, vel);
    }
  }
  return merged;
}

const dragRot = {
  active: false,
  startAngle: 0,
  startDiskAngle: 0,
  anchor: 'water',
  moved: false
};
function clientAngle(ev){
  const {cx, cy} = canvasCenterCss();
  const x = (ev.clientX != null) ? ev.clientX : (ev.touches && ev.touches[0] && ev.touches[0].clientX);
  const y = (ev.clientY != null) ? ev.clientY : (ev.touches && ev.touches[0] && ev.touches[0].clientY);
  if(x == null || y == null) return null;
  const dx = x - cx;
  const dy = cy - y; // 画面座標系をキャンバスの極座標に合わせる
  return Math.atan2(dy, dx);
}
function clientPolar(ev){
  const {cx: cxCss, cy: cyCss} = canvasCenterCss();
  const x = (ev.clientX != null) ? ev.clientX : (ev.touches && ev.touches[0] && ev.touches[0].clientX);
  const y = (ev.clientY != null) ? ev.clientY : (ev.touches && ev.touches[0] && ev.touches[0].clientY);
  if(x == null || y == null) return null;
  const dx = (x - cxCss) * devicePixelRatio;
  const dy = (cyCss - y) * devicePixelRatio;
  return { theta: Math.atan2(dy, dx), r: Math.hypot(dx, dy) };
}
function beginDrag(ev){
  if(ev.button != null && ev.button !== 0) return;
  if(diskLocked){
    startLockedTouch(ev);
    return;
  }
  const ang = clientAngle(ev);
  if(ang == null) return;
  dragRot.active = true;
  dragRot.startAngle = ang;
  dragRot.startDiskAngle = diskAngle;
  dragRot.anchor = anchorSel.value;
  dragRot.moved = false;
  diskOmega = 0; // 手動操作中は慣性をリセット
  if(ev.pointerId != null && cv.setPointerCapture){
    try{ cv.setPointerCapture(ev.pointerId); }catch{}
  }
  ev.preventDefault();
}
function moveDrag(ev){
  if(diskLocked){
    updateLockedTouch(ev);
    ev.preventDefault();
    return;
  }
  if(!dragRot.active) return;
  const ang = clientAngle(ev);
  if(ang == null) return;
  const delta = ang - dragRot.startAngle;
  if(Math.abs(shortestDelta(dragRot.startAngle, ang)) > 0.01) dragRot.moved = true;
  const dir = (dragRot.anchor === 'disk') ? -1 : 1;
  diskAngle = dragRot.startDiskAngle + dir * circleViewSign() * delta;
  diskOmega = 0;
  ev.preventDefault();
}
function endDrag(ev){
  if(diskLocked){
    stopLockedTouch(ev);
    return;
  }
  if(!dragRot.active) return;
  const wasTap = !dragRot.moved && ev && ev.type === 'pointerup';
  dragRot.active = false;
  if(ev && ev.pointerId != null && cv.releasePointerCapture){
    try{ cv.releasePointerCapture(ev.pointerId); }catch{}
  }
  if(wasTap) handleCanvasTap(ev);
}

// liveNotes と fileNotes は後段の描画・物理計算で参照する入力ノート集合を保持する。
// どちらも MIDI ノート番号をキー、ベロシティを値とした Map とし、
// 実行時に随時追加・削除される動的な状態を扱う。
const liveNotes = new Map();     // ハードMIDI入力の現在押下
const fileNotes = new Map();     // 再生中のMIDIファイル由来
const tapNotes = new Map();      // キャンバスタップによる一時的な入力
const lockedTouchNotes = new Map(); // ロック中のタッチ入力（押下中のみ保持）
const tapNoteTimeouts = new Map();
const lockedTouches = new Map(); // pointerId -> {midi, vel}
const mapToPoints = (m)=> Array.from(m, ([midi, vel])=>({midi, vel}));
const TAP_NOTE_DURATION_SEC = 0.8;
const trainerInputState = ()=> mergeNoteMaps(liveNotes, tapNotes, lockedTouchNotes);
function trainerOnInputChange(){
  if(workspaceMode==='train' && fileOp.value==='train' && trainer && trainer.active){
